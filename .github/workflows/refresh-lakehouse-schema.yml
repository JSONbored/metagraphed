name: Refresh lakehouse schema

# THE CHECK NO PULL REQUEST CAN MAKE.
#
# `validate:lakehouse-types-drift` proves the committed types are what the
# committed snapshot produces -- that the repo is internally consistent. It
# cannot prove the SNAPSHOT still matches the live Iceberg catalog, and both
# scripts/generate-lakehouse-types.ts and scripts/validate-lakehouse-types-drift.ts
# say so in as many words: "nothing readable from a pull request can catch the
# LAKEHOUSE having moved."
#
# Until this workflow existed, nothing caught it at all.
# `npm run refresh:lakehouse-schema` was reachable only by hand -- it appeared in
# package.json and in no workflow -- so the snapshot aged silently and the drift
# validator kept passing on a stale pair. A column renamed upstream would have
# been discovered by a cold-tier query returning nothing.
#
# WEEKLY, not daily. An Iceberg schema changes when someone changes a producer,
# which is rare; a daily run would mostly re-prove the same answer, and the
# window this closes is measured in "before anyone notices a route went empty",
# not in hours.
#
# NO AUTO-MERGE, deliberately, unlike the sync-* lanes this is modelled on. A
# schema change is exactly the event a human should see: the generated tuples
# feed the cold tiers' SELECT lists, so a merged rename silently rewrites what
# the readers ask for. The PR is the alert.
on:
  schedule:
    - cron: "0 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-lakehouse-schema
  cancel-in-progress: false

jobs:
  refresh:
    name: Re-snapshot the Iceberg catalog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      # LOUD, not skipped. A missing credential means the catalog went unchecked
      # this week, which is the condition this workflow exists to report -- and a
      # silent skip would restore exactly the "passing on a stale pair" state it
      # replaces. One red run naming the secret is cheaper than a green one that
      # proved nothing.
      - name: Require the catalog credential
        env:
          R2_CATALOG_TOKEN: ${{ secrets.R2_CATALOG_TOKEN }}
        run: |
          if [ -z "$R2_CATALOG_TOKEN" ]; then
            echo "::error::R2_CATALOG_TOKEN is not set. The Iceberg catalog cannot be read," \
                 "so the committed snapshot went unverified. Add it under Settings ->" \
                 "Secrets -> Actions (an R2 API token with data-catalog read)."
            exit 1
          fi

      - name: Re-snapshot and regenerate
        env:
          R2_CATALOG_TOKEN: ${{ secrets.R2_CATALOG_TOKEN }}
        run: |
          npm run refresh:lakehouse-schema
          npm run build:lakehouse-types

      - name: Did the catalog move?
        id: diff
        run: |
          if git diff --quiet -- generated/lakehouse; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The committed snapshot still matches the live catalog."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- generated/lakehouse
          fi

      - name: Open a PR for the drift
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/refresh-lakehouse-schema
          delete-branch: true
          add-paths: |
            generated/lakehouse
          title: "chore(lakehouse): the Iceberg catalog moved"
          commit-message: "chore(lakehouse): re-snapshot the Iceberg catalog"
          body: |
            The live Iceberg catalog no longer matches the committed snapshot. This is the drift `validate:lakehouse-types-drift` structurally cannot see — it compares the committed types to the committed snapshot, and both are updated together here.

            **Read the diff before merging.** The generated column tuples feed the cold tiers' `SELECT` lists (`src/*-cold-tier.ts`), so a renamed or dropped column changes what those readers ask the lakehouse for. A merge is a decision that the readers are still correct against the new schema, not a formality.

            Worth checking specifically:

            - a **removed** column that a reader still projects into its response shape
            - a **renamed** column — the tuple follows it, so the query keeps working while any code reading the old key silently gets `undefined`
            - a **new Iceberg type** — the generator throws rather than guessing, so this PR would not exist; a failed run means the type map needs extending
          labels: |
            automation
