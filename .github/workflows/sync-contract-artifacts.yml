          expected_source = {'package.json': '52500f90371d9fc6cf8c6160bc63685384b4b49a9a87f8dfcfb7c959fddead59', 'apps/ui/package.json': 'e3a86e5aa2fe748f042033ddf4da195568e12c5fc09b9a66c8b66c3aa4f347e2', 'package-lock.json': 'ca23d1cc6245fc06b61c4bf14e298a3e75041a5966d63b4c4e00e5835ec22309', 'apps/ui/tests/e2e/content-runtime-isolation.spec.ts': 'f6df7aadc1ba68ec612eaa4ce17c78f943dcc1b0a73b50155df8502d19a5e064', 'apps/ui/playwright.config.ts': 'e841be1d48fe584b8046106c9af06a925039fd57bd7d4ac21b687865e927da7a', 'apps/ui/src/server.ts': 'b43492635e4c277d12e56dd6bd0ead7a3f689fa071375e4d2583e80c21b4ac24', 'apps/ui/src/start.ts': '7b2a35cfb8f08b2db762d78245ee906491a22bd807066ef40bb21bb080e68c20', 'apps/ui/tests/e2e/api-stub.ts': '86722999dc241b70737c8a78b3a71c84a9a4ff279909112697669dc67684c2c4', 'apps/ui/tests/e2e/serve-e2e.ts': '819950b22abf5ba6a4648ca61aa5fbead97dfb0015e0cfc6e8feae0fb4887fc3', '.npmrc': 'b50bde7ee3e769650d30f1752bf6403f0d69f3a656113d3e2f63c9917a452165', 'apps/ui/src/routes/-root-views.tsx': 'a788155459d3b52e4a32d2de5ac19a2639c7aba3b3f28f6d7cc2da0319672076', 'apps/ui/tests/e2e/native-runtime-diagnostics.ts': '14b5315b9fbbac523005c4e3948024639659e233db6e77905eca79cd5e656914', 'apps/ui/src/routes/docs.$.tsx': 'bfdb40d6548a81de5e2b3013c418a7c39f5d3764236a0fa13aa52b4296bac26e', 'apps/ui/src/routes/index.tsx': '4ff5f3cd13479ea657ebf46662b6e79665771c04ff036798e4614a1c3ff3cb30', 'apps/ui/src/routes/-index-page.tsx': 'd019ff4dcd54e5dedadad63b1828e4e9b7c08bbdf683afcc5e8f2a1be8e9bd3b', 'apps/ui/src/routes/subnets.index.tsx': 'a2639f6f5b27b68e783151a60b10df70eb9ec6f634dee402b295d156a45cd05d', 'apps/ui/src/routes/-subnets-index-page.tsx': 'c8ab864e344d4ffee70e5addc0275409e45cd2ddc7571f5d7d086113cae4bbf3', 'apps/ui/src/lib/metagraphed/subnet-directory-query.ts': '717d4c6bced4c086d7df7da87d2f8a18c7272f774ed18c6ea7b03822c77fbc66', 'apps/ui/tests/e2e/indexable-routes.spec.ts': 'c1fd542e6dc4b711487bd9f98e045a13b41621e04f130dcb446cc350caf6c9f8'}
          expected_baseline = {'package.json': 'f26c329ba493cd1a6c4bb057c8dd9b9f7a18614b6df4001a3835a2db43a187f6', 'apps/ui/package.json': '926be697886dd613f0085a9f6272c6be59b511ef2a84e0811bfd8a7b91725d95', 'package-lock.json': '63025f24ddae435165291d686e2ac01bd7ee3bebe2eee767c0d3521416c42aa2'}
          def git(*args):
