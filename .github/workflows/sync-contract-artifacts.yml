name: Sync contract artifacts

# Catches contract drift that NO per-PR check can see: the kind that only
# exists once two PRs are both on main.
#
# The incident this exists for (2026-07-30, #8774). #8768 refreshed
# github-signals.json, which the subnet profile/detail OpenAPI *examples* are
# generated from. Its own pre-merge build showed a clean public/ because that
# branch was cut before #8758 landed the 76 network-addressed route variants
# that duplicate those examples. Separately, #8761 added networks.json to
# R2_ONLY_PATTERNS, flipping its storage_tier in contracts.json and
# api-index.json. Each PR was self-consistent and green. The combination left
# main's committed artifacts stale, and validate:contract-drift then failed on
# EVERY open PR regardless of its contents until #8775 regenerated them.
#
# A per-PR freshness check is structurally blind to this: it compares a build
# of THAT PR's tree against THAT PR's committed files. Only a build of main
# itself, after the merge, can see it. So this runs on push to main -- the
# moment the drift can first exist -- with a daily schedule as a backstop for
# anything that lands while a run is skipped or fails.
#
# Same auto-PR shape as sync-client-version.yml / sync-mcp-version.yml:
# regenerate, open a PR only when something actually differs, stay silent
# otherwise. (The machine-DATA lanes that used to share this shape --
# sync-operational-surfaces, sync-schema-snapshots, sync-surface-verification,
# sync-github-signals -- are retired: their files are now written directly by
# Worker crons into R2 stores, see #9096. This lane stays a PR because its
# output is COMMITTED CONTRACT -- openapi.json, generated types -- which must
# be reviewed and versioned in git, not swapped underneath a deploy.)
on:
  push:
    branches:
      - main
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:
    inputs:
      prepare_only:
        description: "Generate reviewable source-branch artifacts without opening or merging a sync PR"
        type: boolean
        default: false

      dependency_security_fix:
        description: "Prepare compatible npm security lock changes as an artifact (requires prepare_only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Not cancel-in-progress: a run started by an earlier merge is still checking
  # a real state, and cancelling it could drop the only observation of a drift
  # that the next push happens not to reintroduce.
  group: sync-contract-artifacts
  cancel-in-progress: false

jobs:
  sync:
    name: Regenerate contract artifacts if stale
    runs-on: ubuntu-latest
    timeout-minutes: 30 # runs the full build
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Prepare compatible dependency security lock
        if: inputs.prepare_only == true && inputs.dependency_security_fix == true
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dependency-security"
          git rev-parse HEAD > "$RUNNER_TEMP/dependency-security/source-head.txt"
          audit_status=0
          npm audit --omit=dev --json > "$RUNNER_TEMP/dependency-security/before.json" || audit_status=$?
          test "$audit_status" -le 1
          npm install --ignore-scripts --workspaces --include-workspace-root
          fix_status=0
          npm audit fix --ignore-scripts --workspaces --include-workspace-root || fix_status=$?
          test "$fix_status" -le 1
          npm dedupe --ignore-scripts --workspaces --include-workspace-root
          npm ls @modelcontextprotocol/sdk @tanstack/react-start @tanstack/react-router @tanstack/router-core @tanstack/router-plugin @tanstack/start-server-core posthog-js dompurify undici --all --workspaces --include-workspace-root --json > "$RUNNER_TEMP/dependency-security/installed-security-tree.json"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const tree = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/dependency-security/installed-security-tree.json", "utf8"));
          function checkInstalled(node) {
            if (node.invalid || node.missing) throw new Error("Invalid security dependency: " + JSON.stringify(node));
            for (const child of Object.values(node.dependencies ?? {})) checkInstalled(child);
          }
          checkInstalled(tree);
          const sanitizer = Object.entries(lock.packages).filter(([key]) => /node_modules\/dompurify$/.test(key));
          if (sanitizer.length === 0 || sanitizer.some(([, pkg]) => !/^3\.4\.(1[6-9]|[2-9][0-9])$/.test(pkg.version) || !pkg.integrity)) {
            throw new Error("Patched DOMPurify bytes must be explicitly locked with integrity");
          }
          NODE
          full_audit_status=0
          npm audit --json > "$RUNNER_TEMP/dependency-security/full-after.json" || full_audit_status=$?
          test "$full_audit_status" -le 1
          npm audit --omit=dev --json > "$RUNNER_TEMP/dependency-security/after.json"

      - name: Stage dependency security evidence
        if: always() && inputs.prepare_only == true && inputs.dependency_security_fix == true
        shell: bash
        run: |
          cp package.json package-lock.json "$RUNNER_TEMP/dependency-security/"
          cp apps/ui/package.json "$RUNNER_TEMP/dependency-security/ui-package.json"
          git diff -- package.json package-lock.json apps/ui/package.json > "$RUNNER_TEMP/dependency-security/dependency.patch"

      - name: Retain dependency preparation evidence
        if: always() && inputs.prepare_only == true && inputs.dependency_security_fix == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-security
          path: ${{ runner.temp }}/dependency-security
          retention-days: 7
          if-no-files-found: error

      - name: Install dependencies
        run: npm ci

      # The real build, exactly as a contributor or CI runs it. It does not
      # re-capture github-signals (the Worker cron owns that lane now -- see
      # src/github-signals-sync.ts -- and without Cloudflare credentials in
      # this job's env the build reads the committed seed, never the store),
      # so this run compares generated output against the SAME committed
      # inputs main already has -- a diff here means the committed artifacts
      # are genuinely stale, not that upstream data moved underneath them.
      - name: Build
        run: npm run build

      - name: Generate source-branch Worker binding types
        if: inputs.prepare_only == true
        run: npm run types:workers

      - name: Build source-branch SDK artifacts
        if: inputs.prepare_only == true
        run: npm run build --workspace=packages/client

      - name: Generate source-branch API reference
        if: inputs.prepare_only == true
        working-directory: apps/ui
        run: node scripts/generate-openapi-docs.ts

      - name: Prepare pinned source formatting
        if: inputs.prepare_only == true
        run: |
          paths=(tests/usage-telemetry.test.ts apps/ui/tests/e2e/content-runtime-isolation.spec.ts tests/hot-history-fixture.ts tests/no-sqlite-only-sql.test.ts deploy/chain-detail-payloads/README.md .github/workflows/sync-contract-artifacts.yml src/d1-store.ts src/chain-detail-native-payloads.ts src/chain-detail-payloads.ts src/chain-detail-payload-snapshot.ts src/chain-detail-payload-prune.ts src/chain-detail-prune.ts src/chain-detail-hot-tier.ts src/history-feed-hot-bridge.ts src/indexed-chain-windows.ts src/indexed-extrinsic-feeds.ts tests/chain-detail-reclamation.test.ts tests/history-feed-hot-bridge.test.ts scripts/validate-api.ts src/openapi-sample.ts src/account-holder-directory.ts src/neuron-history-write.ts src/sha256-hex.ts workers/http.ts tests/openapi-sample.test.ts tests/search-quality.test.ts tests/alpha-share-value.test.ts tests/raw-chain-capture.test.ts tests/raw-capture-d1.test.ts tests/raw-capture-finalized.test.ts tests/raw-capture-upgrade-restore.test.ts tests/account-holder-directory.test.ts tests/data-api-tier.test.ts tests/webhook-ledger-d1.test.ts tests/webhook-ledger-wiring.test.ts tests/webhooks-worker.test.ts src/chain-holders.ts src/mcp-server.ts src/subnet-holders.ts src/validator-nominator-positions.ts workers/request-handlers/entities.ts src/graphql.ts src/subnet-yield.ts src/table-freshness-watchdog.ts src/top-holders-holdings.ts src/top-holders.ts src/chain-holders-cache.ts src/nominator-positions-hot-tier.ts src/alpha-snapshot-d1.ts src/self-stake-snapshot-d1.ts src/ledger-d1.ts workers/data-api.ts tests/alpha-snapshot-d1.test.ts tests/helpers/alpha-quantity-fixture.ts tests/helpers/alpha-quantity-d1-fixture.ts tests/subnet-holders.test.ts tests/chain-holders.test.ts tests/validator-nominator-positions.test.ts tests/graphql-subnet-holders.test.ts tests/chain-holders-cache.test.ts tests/chain-yield.test.ts tests/subnet-yield.test.ts tests/subnet-yield-history-csv.test.ts tests/top-holders.test.ts tests/top-holders-holdings.test.ts tests/top-holders-flow-tier.test.ts tests/top-holders-holdings-refresh.test.ts tests/graphql.test.ts tests/mcp-server.test.ts tests/mcp-degraded-marker-completeness.test.ts tests/analytics-edge-cache.test.ts tests/request-handlers-analytics-routes.test.ts tests/request-handlers-entities.test.ts tests/explorer-directory-materialization.test.ts tests/nominator-positions-cold-tier.test.ts tests/nominator-positions-hot-tier.test.ts tests/native-position-readers.test.ts tests/data-api-neurons.test.ts apps/ui/src/hooks/use-stake-flow.ts apps/ui/src/lib/metagraphed/types.ts)
          npx prettier --write tests/usage-telemetry.test.ts apps/ui/tests/e2e/content-runtime-isolation.spec.ts tests/hot-history-fixture.ts tests/no-sqlite-only-sql.test.ts deploy/chain-detail-payloads/README.md .github/workflows/sync-contract-artifacts.yml src/d1-store.ts src/chain-detail-native-payloads.ts src/chain-detail-payloads.ts src/chain-detail-payload-snapshot.ts src/chain-detail-payload-prune.ts src/chain-detail-prune.ts src/chain-detail-hot-tier.ts src/history-feed-hot-bridge.ts src/indexed-chain-windows.ts src/indexed-extrinsic-feeds.ts tests/chain-detail-reclamation.test.ts tests/history-feed-hot-bridge.test.ts scripts/validate-api.ts src/openapi-sample.ts src/account-holder-directory.ts src/neuron-history-write.ts src/sha256-hex.ts workers/http.ts tests/openapi-sample.test.ts tests/search-quality.test.ts tests/alpha-share-value.test.ts tests/raw-chain-capture.test.ts tests/raw-capture-d1.test.ts tests/raw-capture-finalized.test.ts tests/raw-capture-upgrade-restore.test.ts tests/account-holder-directory.test.ts tests/data-api-tier.test.ts tests/webhook-ledger-d1.test.ts tests/webhook-ledger-wiring.test.ts tests/webhooks-worker.test.ts src/chain-holders.ts src/mcp-server.ts src/subnet-holders.ts src/validator-nominator-positions.ts workers/request-handlers/entities.ts src/graphql.ts src/subnet-yield.ts src/table-freshness-watchdog.ts src/top-holders-holdings.ts src/top-holders.ts src/chain-holders-cache.ts src/nominator-positions-hot-tier.ts src/alpha-snapshot-d1.ts src/self-stake-snapshot-d1.ts src/ledger-d1.ts workers/data-api.ts tests/alpha-snapshot-d1.test.ts tests/helpers/alpha-quantity-fixture.ts tests/helpers/alpha-quantity-d1-fixture.ts tests/subnet-holders.test.ts tests/chain-holders.test.ts tests/validator-nominator-positions.test.ts tests/graphql-subnet-holders.test.ts tests/chain-holders-cache.test.ts tests/chain-yield.test.ts tests/subnet-yield.test.ts tests/subnet-yield-history-csv.test.ts tests/top-holders.test.ts tests/top-holders-holdings.test.ts tests/top-holders-flow-tier.test.ts tests/top-holders-holdings-refresh.test.ts tests/graphql.test.ts tests/mcp-server.test.ts tests/mcp-degraded-marker-completeness.test.ts tests/analytics-edge-cache.test.ts tests/request-handlers-analytics-routes.test.ts tests/request-handlers-entities.test.ts tests/explorer-directory-materialization.test.ts tests/nominator-positions-cold-tier.test.ts tests/nominator-positions-hot-tier.test.ts tests/native-position-readers.test.ts tests/data-api-neurons.test.ts
          (cd apps/ui && npx prettier --write src/hooks/use-stake-flow.ts src/lib/metagraphed/types.ts)
          mkdir -p "$RUNNER_TEMP/source-format"
          git rev-parse HEAD > "$RUNNER_TEMP/source-format/source-head.txt"
          printf '%s\n' "${paths[@]}" > "$RUNNER_TEMP/source-format/paths.txt"
          for file in "${paths[@]}"; do
            mkdir -p "$RUNNER_TEMP/source-format/$(dirname "$file")"
            cp "$file" "$RUNNER_TEMP/source-format/$file"
          done

      - name: Upload pinned source formatting
        if: inputs.prepare_only == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-format
          path: ${{ runner.temp }}/source-format
          retention-days: 1
          if-no-files-found: error

      - name: Stage source-branch generated contracts
        if: inputs.prepare_only == true
        run: |
          mkdir -p "$RUNNER_TEMP/source-contracts"
          git rev-parse HEAD > "$RUNNER_TEMP/source-contracts/source-head.txt"
          git diff --name-only -- public/metagraph/openapi.json public/metagraph/contracts.json public/metagraph/api-index.json public/metagraph/types.d.ts generated/graphql generated/metagraphed-client.ts packages/contract packages/client/dist apps/ui/content/docs/api-reference workers/worker-configuration.d.ts workers/data-api.worker-configuration.d.ts workers/registry-sync-api.worker-configuration.d.ts workers/wss-lb.worker-configuration.d.ts > "$RUNNER_TEMP/source-contracts/paths.txt"
          while IFS= read -r file; do
            test -f "$file"
            mkdir -p "$RUNNER_TEMP/source-contracts/$(dirname "$file")"
            cp "$file" "$RUNNER_TEMP/source-contracts/$file"
          done < "$RUNNER_TEMP/source-contracts/paths.txt"

      - name: Upload source-branch generated contracts
        if: inputs.prepare_only == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-contracts
          path: ${{ runner.temp }}/source-contracts
          retention-days: 1
          if-no-files-found: error

      - name: Qualify prepared quantity source
        if: inputs.prepare_only == true
        run: |
          npm run validate:untyped-db-reads
          npm run validate:type-duplicates
          npm run typecheck
          npm run build --workspace=packages/ui-kit
          npm run typecheck --workspace=apps/ui

      - name: Qualify dependency UI production build
        if: inputs.prepare_only == true && inputs.dependency_security_fix == true
        run: npm run build:worker:e2e --workspace=apps/ui

      - name: Qualify API quantity assertions
        if: inputs.prepare_only == true
        run: npm run validate:api

      - name: Quantity backend contract regressions
        if: inputs.prepare_only == true
        id: quantity_backend
        env:
          METAGRAPH_RECLAMATION_EVIDENCE: ${{ runner.temp }}/payload-reclamation
        run: npx vitest run tests/usage-telemetry.test.ts tests/no-sqlite-only-sql.test.ts tests/indexed-chain-windows.test.ts tests/indexed-extrinsic-feeds.test.ts tests/chain-detail-reclamation.test.ts tests/chain-detail-d1.test.ts tests/history-feed-hot-bridge.test.ts tests/chain-detail-payload-publication.test.ts tests/data-api-bundle-boundary.test.ts tests/quantity-contract.test.ts tests/request-work-batches.test.ts tests/metagraph-neurons.test.ts tests/accounts-list.test.ts tests/account-portfolio.test.ts tests/account-position-history.test.ts tests/validator-history.test.ts tests/validator-operator-directory.test.ts tests/account-holder-directory.test.ts tests/account-nominator-positions.test.ts tests/published-query-bindings.test.ts tests/neon-sole-store-tables-exist.test.ts tests/neon-flag-config-parity.test.ts tests/read-store-tables-match-the-sql.test.ts tests/data-api-neurons.test.ts tests/alpha-snapshot-d1.test.ts tests/self-stake-snapshot-d1.test.ts tests/openapi-sample.test.ts tests/search-quality.test.ts

      - name: Retain supplied reclamation cut
        if: ${{ always() && inputs.prepare_only == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: payload-reclamation-cut
          path: ${{ runner.temp }}/payload-reclamation
          retention-days: 7
          if-no-files-found: ignore

      - name: Complete UI quantity regressions
        if: ${{ !cancelled() && inputs.prepare_only == true }}
        id: quantity_ui
        run: npm run test --workspace=apps/ui

      - name: Require every quantity regression suite
        if: ${{ !cancelled() && inputs.prepare_only == true }}
        run: |
          test "${{ steps.quantity_backend.outcome }}" = success
          test "${{ steps.quantity_ui.outcome }}" = success

      # Scoped to the contract artifacts on purpose. build.ts already
      # auto-reverts the deploy-owned pair (r2-manifest.json,
      # schemas/index.json, see DEPLOY_OWNED_ARTIFACTS in scripts/lib.ts), and
      # anything else the build touches belongs to whichever sync workflow owns
      # it -- this one must not quietly adopt their files.
      - name: Check whether the contract artifacts changed
        id: diff
        run: |
          paths=(
            public/metagraph/openapi.json
            public/metagraph/contracts.json
            public/metagraph/api-index.json
            public/metagraph/types.d.ts
            packages/contract/index.d.ts
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "contract artifacts match a fresh build of main"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "contract artifacts on main are stale:"
            git diff --stat -- "${paths[@]}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize which artifacts drifted
        if: steps.diff.outputs.changed == 'true'
        id: summary
        run: |
          files=$(git diff --name-only -- \
            public/metagraph/openapi.json \
            public/metagraph/contracts.json \
            public/metagraph/api-index.json \
            public/metagraph/types.d.ts \
            packages/contract/index.d.ts \
            | xargs -n1 basename | paste -sd ", " -)
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Open sync PR (no-op if unchanged)
        if: steps.diff.outputs.changed == 'true' && inputs.prepare_only != true
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        id: pr
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/sync-contract-artifacts
          delete-branch: true
          add-paths: |
            public/metagraph/openapi.json
            public/metagraph/contracts.json
            public/metagraph/api-index.json
            public/metagraph/types.d.ts
            packages/contract/index.d.ts
          title: "chore(build): sync contract artifacts (${{ steps.summary.outputs.files }})"
          commit-message: "chore(build): sync contract artifacts (${{ steps.summary.outputs.files }})"
          body: |
            A fresh `npm run build` of `main` no longer matches the committed contract artifacts. Drifted: `${{ steps.summary.outputs.files }}`.

            **Merge this promptly.** While `main` is in this state, `validate:contract-drift` fails on every open PR regardless of its contents — that is what #8774 was.

            This usually means two PRs were individually green and mutually inconsistent: each was built against a tree that did not yet contain the other. No per-PR check can see that, which is why this workflow builds `main` itself after every merge.

            If the diff looks like more than a regeneration, check what merged just before it rather than merging this on trust.
          labels: |
            automation
      # #233 interim: merge the bot PR itself once its own checks are green,
      # replacing the daily manual merge. Deliberately the RELEASE_PLEASE_TOKEN
      # (a real PAT) rather than GITHUB_TOKEN: a GITHUB_TOKEN merge would not
      # trigger push-to-main workflows (the merge-triggered fast registry sync,
      # the version-bump lanes), silently detaching everything that reacts to
      # these merges. A failed or missing check leaves the PR open for a human
      # and turns this run red, which is the alert.
      - name: Auto-merge when checks are green
        if: steps.pr.outputs.pull-request-number
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          pr="${{ steps.pr.outputs.pull-request-number }}"
          # Checks register within moments of the branch push; give them a
          # beat so --watch sees the run instead of "no checks reported".
          sleep 60
          gh pr checks "$pr" --watch --fail-fast
          gh pr merge "$pr" --squash
