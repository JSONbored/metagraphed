name: Auth.md formatter diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format:
    name: Return pinned formatter output
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 541ea597a26f1c034b099e0ab5ab5d7fe9aed785
          persist-credentials: false
          fetch-depth: 1
      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.2
      - name: Verify immutable source inputs
        shell: bash
        run: |
          python3 - <<'PY_INPUTS'
          import hashlib,json,pathlib,subprocess
          expected={'source_sha': '541ea597a26f1c034b099e0ab5ab5d7fe9aed785', 'source_tree': '4806391e4bd8a7d663071ce08c90d417a0e8825a', 'lock_sha256': '0ee7606cb7c0b3cf32e0cf73781e2c05ff755fe5994f531682be741b84e24ea5', 'test_sha256': '72cc09e8022322cca755559869e795b7887d326b3222a4193aa3560f6b08f3a3', 'prettier_version': '3.9.6'}
          def git(*args):return subprocess.check_output(['git',*args])
          assert git('rev-parse','HEAD').decode().strip()==expected['source_sha']
          assert git('rev-parse','HEAD^{tree}').decode().strip()==expected['source_tree']
          assert hashlib.sha256(pathlib.Path('package-lock.json').read_bytes()).hexdigest()==expected['lock_sha256']
          assert hashlib.sha256(pathlib.Path('tests/agent-auth-store.test.ts').read_bytes()).hexdigest()==expected['test_sha256']
          assert not git('status','--porcelain','--untracked-files=all').strip()
          print(json.dumps(expected,indent=2))
          PY_INPUTS
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format exact test to runner temporary output only
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        shell: bash
        run: |
          python3 - <<'PY_FORMAT'
          import difflib,hashlib,json,os,pathlib,subprocess
          expected={'source_sha': '541ea597a26f1c034b099e0ab5ab5d7fe9aed785', 'source_tree': '4806391e4bd8a7d663071ce08c90d417a0e8825a', 'lock_sha256': '0ee7606cb7c0b3cf32e0cf73781e2c05ff755fe5994f531682be741b84e24ea5', 'test_sha256': '72cc09e8022322cca755559869e795b7887d326b3222a4193aa3560f6b08f3a3', 'prettier_version': '3.9.6'}
          target='tests/agent-auth-store.test.ts'
          prettier='./node_modules/.bin/prettier'
          def git(*args):return subprocess.check_output(['git',*args])
          def sha(body):return hashlib.sha256(body).hexdigest()
          version=subprocess.check_output([prettier,'--version']).decode().strip()
          assert version==expected['prettier_version']=='3.9.6',version
          assert subprocess.check_output(['node','--version']).decode().strip()=='v22.23.2'
          before=pathlib.Path(target).read_bytes()
          formatted=subprocess.check_output([prettier,target])
          assert subprocess.check_output([prettier,'--stdin-filepath',target],input=formatted)==formatted
          assert git('rev-parse','HEAD').decode().strip()==expected['source_sha']
          assert git('rev-parse','HEAD^{tree}').decode().strip()==expected['source_tree']
          assert sha(pathlib.Path('package-lock.json').read_bytes())==expected['lock_sha256']
          assert sha(before)==sha(pathlib.Path(target).read_bytes())==expected['test_sha256']
          assert not git('status','--porcelain','--untracked-files=all').strip()
          patch=''.join(difflib.unified_diff(before.decode().splitlines(keepends=True),formatted.decode().splitlines(keepends=True),fromfile='a/'+target,tofile='b/'+target)).encode()
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'authmd-format-output'
          output.mkdir()
          (output/'agent-auth-store.test.ts').write_bytes(formatted)
          (output/'formatting.patch').write_bytes(patch)
          lock=json.loads(pathlib.Path('package-lock.json').read_bytes())
          installed=json.loads(pathlib.Path('node_modules/prettier/package.json').read_bytes())
          assert installed['version']==version
          receipt={**expected,'status':'success','repository':os.environ['GITHUB_REPOSITORY'],'workflow_sha':os.environ['WORKFLOW_SHA'],'workflow_ref':os.environ['WORKFLOW_REF'],'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'node':subprocess.check_output(['node','--version']).decode().strip(),'npm':subprocess.check_output(['npm','--version']).decode().strip(),'formatter':prettier,'formatter_version':version,'formatter_integrity':lock['packages']['node_modules/prettier']['integrity'],'test_path':target,'source_lock_sha256':sha(git('show','HEAD:package-lock.json')),'source_test_sha256':sha(git('show','HEAD:'+target)),'output_test_sha256':sha(formatted),'patch_sha256':sha(patch),'commands':[['npm','ci','--ignore-scripts','--no-audit','--no-fund'],[prettier,target],[prettier,'--stdin-filepath',target]],'dirty_paths':[]}
          (output/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          print(patch.decode())
          PY_FORMAT
      - name: Upload formatter output and verification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: authmd-format-541ea597a26f1c034b099e0ab5ab5d7fe9aed785-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/authmd-format-output
          if-no-files-found: error
          retention-days: 7
