        shell: bash
        run: |
          python3 - <<'PY_BASELINE_QUALIFICATION'
          import base64, hashlib, json, os, pathlib, re, stat, subprocess
          root = pathlib.Path.cwd().resolve()
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "server-function-baseline"
          output.mkdir(parents=True, exist_ok=True)
          reasons = []
          observations = None
          inputs = None
          installed = None
          report = None
          report_path = output / "e2e-results.json"
          MAX_REPORT = 8 * 1024 * 1024
          MAX_ATTACHMENT = 16 * 1024
          MAX_LOG = 1024 * 1024
          def sha(body):
              return hashlib.sha256(body).hexdigest()
          def load_bounded(path, limit):
              if path.is_symlink() or not path.is_file() or path.stat().st_size > limit:
                  raise ValueError("Missing, non-regular or oversized diagnostic: " + path.name)
              return json.loads(path.read_text())
          try:
              phases = json.loads(os.environ["PHASE_OUTCOMES"])
              if any(value != "success" for value in phases.values()):
                  raise ValueError("A required preparation/build/browser/test phase failed or was skipped")
              inputs = load_bounded(output / "inputs.json", MAX_REPORT)
              installed = load_bounded(output / "installed-versions.json", MAX_REPORT)
              head = subprocess.check_output(["git", "rev-parse", "HEAD"]).decode().strip()
              if head != inputs["application_source"]:
                  raise ValueError("Application HEAD changed")
              for name, digest in inputs["baseline_input_sha256"].items():
                  if sha((root / name).read_bytes()) != digest:
                      raise ValueError("Dependency input changed after npm ci: " + name)
              for name, digest in inputs["patched_input_sha256"].items():
                  if name not in inputs["baseline_input_sha256"] and sha((root / name).read_bytes()) != digest:
                      raise ValueError("Application/test/config source changed: " + name)
              if (output / "test-exit.txt").read_text().strip() != "1":
                  raise ValueError("Expected the retained safety test to fail once with exit code 1")
              report = load_bounded(report_path, MAX_REPORT)
              if report.get("errors"):
                  raise ValueError("Playwright reported setup/teardown/global errors")
              entries = []
              def visit(suites):
                  for suite in suites or []:
                      for spec in suite.get("specs", []):
                          for test in spec.get("tests", []):
                              entries.append((spec, test))
                      visit(suite.get("suites", []))
              visit(report.get("suites", []))
              if len(entries) != 1:
                  raise ValueError("Expected exactly one focused test, not a generic red suite")
              spec, test = entries[0]
              expected_title = "a malformed server-function link cannot become an HTML document"
              if spec.get("title") != expected_title or test.get("projectName") != "interaction":
                  raise ValueError("Unexpected test or Playwright project")
              if not str(spec.get("file", "")).replace("\\", "/").endswith("content-runtime-isolation.spec.ts"):
                  raise ValueError("Unexpected test source file")
              results = test.get("results", [])
              if test.get("expectedStatus") != "passed" or test.get("status") != "unexpected" or len(results) != 1:
                  raise ValueError("Expected one failed ordinary safety test, without retry or test.fail inversion")
              result = results[0]
              if result.get("status") != "failed" or result.get("retry") != 0 or not result.get("errors"):
                  raise ValueError("Failure was skipped, timed out, interrupted, retried or not an assertion failure")
              attachments = [a for a in result.get("attachments", []) if a.get("name") == "server-function-response-boundary"]
              if len(attachments) != 1 or attachments[0].get("contentType") != "application/json":
                  raise ValueError("Expected one exact response-boundary JSON attachment")
              attachment = attachments[0]
              bodies = []
              if "body" in attachment and attachment["body"] is not None:
                  value = attachment["body"]
                  if not isinstance(value, str) or len(value) > MAX_ATTACHMENT * 2:
                      raise ValueError("Invalid inline attachment")
                  bodies.append(base64.b64decode(value, validate=True))
              if attachment.get("path"):
                  value = pathlib.Path(attachment["path"])
                  candidates = [value] if value.is_absolute() else [root / "apps/ui" / value, root / value, report_path.parent / value]
                  allowed = [(root / "apps/ui/test-results").resolve(), (pathlib.Path(os.environ["RUNNER_TEMP"]) / "server-function-baseline-results").resolve()]
                  found = []
                  for candidate in candidates:
                      resolved = candidate.resolve()
                      if not any(resolved.is_relative_to(base) for base in allowed):
                          continue
                      if candidate.exists() and not candidate.is_symlink() and candidate.is_file() and candidate.stat().st_size <= MAX_ATTACHMENT:
                          for parent in [candidate, *candidate.parents]:
                              if parent.is_symlink():
                                  raise ValueError("Symlink in attachment path")
                          found.append(candidate.read_bytes())
                  if len(found) != 1:
                      raise ValueError("Missing, ambiguous, unsafe or oversized attachment path")
                  bodies.append(found[0])
              if not bodies or any(len(b) > MAX_ATTACHMENT for b in bodies) or any(b != bodies[0] for b in bodies[1:]):
                  raise ValueError("Missing, oversized or inconsistent attachment contents")
              observations = json.loads(bodies[0])
              expected = {
                  "control_status": 200,
                  "control_internal_header": "true",
                  "attack_status": 200,
                  "attack_internal_header_present": False,
                  "attack_navigation": True,
                  "attack_method": "GET",
                  "canary_in_body": True,
                  "canary_executed": True,
              }
              for name, value in expected.items():
                  if type(observations.get(name)) is not type(value) or observations[name] != value:
                      raise ValueError("Required baseline observation absent: " + name)
              if not re.fullmatch(r"text/html(?:\s*;[^\r\n]*)?", observations.get("content_type", ""), re.I):
                  raise ValueError("Baseline did not return attacker-controlled HTML")
              if not str(observations.get("transport_path", "")).startswith("/_serverFn/") or len(observations["transport_path"]) > 2048:
                  raise ValueError("Unexpected public transport path")
              if observations.get("serialized") == "true":
                  raise ValueError("Baseline result was serialized instead of becoming HTML")
          except Exception as error:
              reasons.append(str(error)[:2048])

          # Export only bounded diagnostics, never the mixed dependency files or built Worker.
          # Raw reports contain public local test metadata; copy them only below the size cap.
          if report_path.exists() and (report_path.is_symlink() or report_path.stat().st_size > MAX_REPORT):
              report_path.unlink()
          for name in ["npm-ci.log", "build-client.log", "build-ui-kit.log", "build-chain-summaries.log", "build-ui.log", "chromium.log", "test.log"]:
              path = output / name
              if path.exists():
                  if path.is_symlink() or not path.is_file():
                      path.unlink()
                      continue
                  if path.stat().st_size > MAX_LOG:
                      with path.open("rb") as stream:
                          stream.seek(-MAX_LOG, 2)
                          tail = stream.read(MAX_LOG)
                      path.write_bytes(b"[bounded tail]\n" + tail)
          selected_observations = None
          if isinstance(observations, dict):
              selected_observations = {k: observations.get(k) for k in ["transport_path", "control_status", "attack_status", "content_type", "control_internal_header", "attack_internal_header_present", "attack_navigation", "attack_method", "serialized", "raw", "canary_in_body", "canary_executed"]}
          receipt = {
              "qualification": "baseline-exposure-demonstrated" if not reasons else "not-qualified",
              "expected_application_source": "d623ef8e5a6df0265d04ced02914bcc39da320c6",
              "expected_dependency_baseline": "ca93ab3abfa2c32de36a6cb5b9d2905386b76d70",
              "reasons": reasons,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_sha": os.environ["WORKFLOW_SHA"],
              "workflow_ref": os.environ["WORKFLOW_REF"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "inputs": inputs,
              "installed": installed,
              "phase_outcomes": json.loads(os.environ["PHASE_OUTCOMES"]),
              "observations": selected_observations,
              "playwright_report_sha256": sha(report_path.read_bytes()) if report_path.is_file() else None,
              "stats": report.get("stats") if report else None,
              "test_command": "npm run test:e2e --workspace=apps/ui -- tests/e2e/content-runtime-isolation.spec.ts --project=interaction --no-deps --grep 'a malformed server-function link cannot become an HTML document' --workers=1 --retries=0",
          }
          (output / "qualification.json").write_text(json.dumps(receipt, indent=2) + "\n")
          if reasons:
              raise SystemExit("Baseline sensitivity was not established: " + "; ".join(reasons))
          print("The unchanged safety test failed on the exact vulnerable dependency baseline with the required HTML canary observations.")
          PY_BASELINE_QUALIFICATION
      - name: Upload bounded diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-function-vulnerable-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/server-function-baseline/inputs.json
            ${{ runner.temp }}/server-function-baseline/installed-versions.json
            ${{ runner.temp }}/server-function-baseline/qualification.json
            ${{ runner.temp }}/server-function-baseline/e2e-results.json
            ${{ runner.temp }}/server-function-baseline/test-exit.txt
            ${{ runner.temp }}/server-function-baseline/*.log
          retention-days: 7
          if-no-files-found: error
