name: History asset tools

on:
  pull_request:
    paths:
      - src/history-asset-transfer.ts
      - tests/history-asset-transfer.test.ts
      - .github/workflows/history-asset-tools.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: history-asset-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Build portable transfer module
        run: node_modules/.bin/esbuild src/history-asset-transfer.ts --bundle --platform=neutral --format=esm --external:node:* --outfile=dist/history-asset-tools/transfer.mjs
      - name: Upload transfer module
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: history-asset-tools
          path: dist/history-asset-tools/transfer.mjs
          if-no-files-found: error
          retention-days: 7
