name: D1 maintenance

on:
  push:
    branches: [main]
    paths:
      - "migrations/d1/**"
      - "scripts/snapshot-d1-schema.ts"
      - "scripts/lib/d1-admin.ts"
      - "generated/db/d1-schema.json"
      - "db/d1-schema.sql"
      - ".github/workflows/d1-maintenance.yml"
  schedule:
    - cron: "0 6 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.2
      - run: npm ci --ignore-scripts
      - name: Apply tracked D1 migrations
        if: github.event_name != 'schedule'
        run: npm run migrate:d1 -- --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      - name: Verify physical D1 schema
        run: npm run snapshot:d1-schema
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      - name: Verify declared logical tables
        run: npm run validate:declared-tables-exist
