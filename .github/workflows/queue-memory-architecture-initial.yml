name: Data API type-contract graph and focused qualification

on:
  push:
    branches:
      - ci/data-api-type-contract-graph-20261020

permissions:
  contents: read

concurrency:
  group: data-api-type-contract-graph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.ref == 'refs/heads/ci/data-api-type-contract-graph-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_WRITE_LOGS: "false"
      FORCE_COLOR: "0"
    steps:
      - name: Checkout exact source carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pinned existing Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install existing locked workspace dependencies
        uses: ./.github/actions/install-deps
      - name: Prove complete canonical tree and overlay exact actual21 baseline
        id: baseline
        run: node .github/scripts/apply-data-api-type-contract-graph.ts baseline
      - name: Measure exact pinned pre-extraction graph and compiler output hash
        id: graph_before
        if: always() && steps.baseline.outcome == 'success'
        run: node .github/scripts/check-data-api-contract-graph.ts before
      - name: Apply exact39 type-contract pairs and stage final94 public sources
        id: extract
        if: always() && steps.baseline.outcome == 'success' && steps.graph_before.outcome == 'success'
        run: node .github/scripts/apply-data-api-type-contract-graph.ts extract
      - name: Measure immutable unformatted extraction frame
        id: graph_after
        if: always() && steps.extract.outcome == 'success'
        run: node .github/scripts/check-data-api-contract-graph.ts after
      - name: Require exact extraction compiler equivalence and unchanged graph gates
        if: always() && steps.graph_before.outcome == 'success' && steps.graph_after.outcome == 'success'
        run: node .github/scripts/check-data-api-contract-graph.ts compare
      - name: Verify exact final overlay without changing Git HEAD or product source
        id: overlay
        if: always() && steps.extract.outcome == 'success'
        run: node .github/scripts/check-queue-memory-architecture.ts apply
      - name: Verify inherited bounded diagnostic projection controls
        id: controls
        if: always() && steps.overlay.outcome == 'success'
        run: node .github/scripts/check-queue-memory-architecture.ts controls
      - name: Obtain native formatted source with separate input and output pins
        id: format
        if: always() && steps.overlay.outcome == 'success' && steps.controls.outcome == 'success'
        run: node .github/scripts/check-queue-memory-architecture.ts format
      - name: Run actual native Node decoder controls
        if: always() && steps.format.outcome == 'success'
        run: node .github/scripts/check-data-api-contract-graph.ts controls
      - name: Measure separate actual formatted frame and unchanged graph gates
        if: always() && steps.format.outcome == 'success' && steps.graph_after.outcome == 'success'
        run: node .github/scripts/check-data-api-contract-graph.ts formatted
      - name: Lint actual formatted source and all TypeScript carrier helpers
        if: always() && steps.format.outcome == 'success' && steps.controls.outcome == 'success'
        run: node .github/scripts/check-queue-memory-architecture.ts lint
      - name: Cold canonical workspace typecheck
        if: always() && steps.format.outcome == 'success' && steps.controls.outcome == 'success'
        run: node .github/scripts/check-queue-memory-architecture.ts types
      - name: Cold helper typecheck with inherited strict options
        if: always() && steps.format.outcome == 'success' && steps.controls.outcome == 'success'
        run: node .github/scripts/check-queue-memory-architecture.ts helper_types
      - name: Validate unchanged canonical boundary-cast policy
        if: always() && steps.format.outcome == 'success' && steps.controls.outcome == 'success'
        run: node .github/scripts/check-queue-memory-architecture.ts boundary
      - name: Validate unchanged canonical workflow policy
        if: always() && steps.format.outcome == 'success' && steps.controls.outcome == 'success'
        run: node .github/scripts/check-queue-memory-architecture.ts workflow
      - name: Run unchanged nine-file focused suite including exact canonical19
        if: always() && steps.format.outcome == 'success' && steps.controls.outcome == 'success'
        run: node .github/scripts/check-queue-memory-architecture.ts tests
      - name: Require every native focused qualification phase
        if: always() && steps.overlay.outcome == 'success'
        run: node .github/scripts/check-queue-memory-architecture.ts summary
      - name: Require both exact extraction and actual formatted graph receipts
        if: always() && steps.format.outcome == 'success'
        run: node .github/scripts/check-data-api-contract-graph.ts summary
      - name: Retain exact finite public source and bounded curated receipts
        if: always() && steps.baseline.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: data-api-type-contract-graph-${{ github.run_attempt }}-${{ job.status }}-source
