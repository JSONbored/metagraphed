name: Check operation latency
run-name: Catalog acceptance read-only 12094

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: catalog-acceptance-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  catalog-observation:
    name: Bounded public catalog observation
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout exact collector source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
      - name: Observe finite serial walks without retries
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { writeFileSync } from 'node:fs';
          import { setTimeout as pause } from 'node:timers/promises';
          const limits = { requests: 7, responseByteCancellationThreshold: 131072, totalByteCancellationThreshold: 1048576, requestWindowMs: 60000, requestMs: 10000, spacingMs: 1600 };
          const started = performance.now();
          const report = { issue: 12094, collectorSha: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID, startedAt: new Date().toISOString(), limits, expectedApiVersionFromProvider: 'c59fa1cf-c090-4319-b914-607285ced44e', expectedApiCommitFromProvider: 'a594ff3da7fb099bad70f4d2f2efceafa8021c46', requests: [], walks: [], limitations: ['Client timing includes network and body transfer; it is not server CPU.', 'Response cache headers describe deliveries, not independent source reads.', 'Token/identity/total/offset checks establish protocol traversal; canonical producer population is not independently inventoried.', 'No production mutation or retry is used to induce restart.', 'No server heap or peak memory measurement is provided.'] };
          const headerNames = ['cf-ray', 'date', 'etag', 'cache-control', 'cf-cache-status', 'age', 'server-timing', 'x-metagraph-cache', 'x-metagraph-cache-profile', 'x-metagraph-artifact-source', 'x-metagraph-artifact-resolution', 'x-metagraph-storage-tier', 'x-metagraph-contract-version', 'x-metagraph-published-at', 'x-metagraph-degraded'];
          let totalBytes = 0;
          let halted = false;
          for (const spec of [{ path: 'endpoints', limit: 200, maxPages: 4 }, { path: 'providers', limit: 100, maxPages: 3 }]) {
            const walk = { path: spec.path, limit: spec.limit, maxPages: spec.maxPages, outcome: 'page_budget', ids: [], requestIndexes: [] };
            report.walks.push(walk);
            let cursor = 0;
            let snapshot = 'start';
            let total;
            try {
              for (let page = 0; page < spec.maxPages; page += 1) {
                if (halted || report.requests.length >= limits.requests) { walk.outcome = 'request_budget'; break; }
                if (report.requests.length) {
                  if (limits.requestWindowMs - (performance.now() - started) <= limits.spacingMs) { halted = true; walk.outcome = 'time_budget'; break; }
                  await pause(limits.spacingMs);
                }
                const remaining = limits.requestWindowMs - (performance.now() - started);
                if (remaining <= 0) { halted = true; walk.outcome = 'time_budget'; break; }
                const url = new URL('https://api.metagraph.sh/api/v1/' + spec.path);
                url.searchParams.set('limit', String(spec.limit));
                url.searchParams.set('cursor', String(cursor));
                url.searchParams.set('fields', 'id');
                url.searchParams.set('page_snapshot', snapshot);
                const receipt = { index: report.requests.length, url: url.href, startedAt: new Date().toISOString(), method: 'GET', headers: {} };
                report.requests.push(receipt);
                walk.requestIndexes.push(receipt.index);
                const before = performance.now();
                const response = await fetch(url, { method: 'GET', redirect: 'error', headers: { accept: 'application/json', 'user-agent': 'Metagraphed read-only acceptance 12094; native GitHub CI' }, signal: AbortSignal.timeout(Math.max(1, Math.floor(Math.min(limits.requestMs, remaining)))) });
                receipt.clientHeaderWallMs = performance.now() - before;
                receipt.status = response.status;
                for (const name of headerNames) { const value = response.headers.get(name); if (value !== null) receipt.headers[name] = value; }
                const reader = response.body.getReader();
                const chunks = [];
                let bytes = 0;
                while (true) {
                  const part = await reader.read();
                  if (part.done) break;
                  bytes += part.value.byteLength;
                  totalBytes += part.value.byteLength;
                  receipt.responseBytes = bytes;
                  if (bytes > limits.responseByteCancellationThreshold || totalBytes > limits.totalByteCancellationThreshold) { await reader.cancel(); halted = true; throw new Error('response byte cancellation threshold crossed'); }
                  chunks.push(Buffer.from(part.value));
                }
                receipt.clientBodyWallMs = performance.now() - before;
                receipt.finishedAt = new Date().toISOString();
                const bodyBytes = Buffer.concat(chunks);
                receipt.bodySha256 = createHash('sha256').update(bodyBytes).digest('hex');
                const body = JSON.parse(bodyBytes.toString('utf8'));
                receipt.meta = Object.fromEntries(['source', 'generated_at', 'published_at', 'freshness', 'pagination'].filter(key => Object.hasOwn(body.meta ?? {}, key)).map(key => [key, body.meta[key]]));
                if (response.status === 400 && body.error?.code === 'invalid_query' && body.meta?.parameter === 'page_snapshot') { receipt.error = { code: body.error.code, parameter: body.meta.parameter }; walk.outcome = 'restart_required'; break; }
                assert.equal(response.status, 200);
                assert.equal(body.ok, true);
                assert.ok(!response.headers.has('x-metagraph-degraded'));
                const rows = body.data?.[spec.path];
                const pagination = body.meta?.pagination;
                assert.ok(Array.isArray(rows));
                assert.equal(pagination.cursor, cursor);
                assert.equal(pagination.returned, rows.length);
                assert.ok(rows.length <= spec.limit);
                assert.ok(Number.isSafeInteger(pagination.total) && pagination.total >= 0);
                assert.match(pagination.snapshot, /^v1\.[0-9a-f]{64}$/);
                if (snapshot !== 'start') assert.equal(pagination.snapshot, snapshot);
                if (total !== undefined) assert.equal(pagination.total, total);
                total = pagination.total;
                snapshot = pagination.snapshot;
                walk.snapshot = snapshot;
                walk.total = total;
                for (const row of rows) { assert.equal(typeof row.id, 'string'); assert.ok(row.id.length); assert.ok(!walk.ids.includes(row.id)); walk.ids.push(row.id); }
                cursor += rows.length;
                if (pagination.next_cursor === null) { assert.equal(cursor, total); walk.outcome = 'protocol_complete'; break; }
                assert.ok(rows.length > 0);
                assert.equal(pagination.next_cursor, cursor);
              }
            } catch (error) {
              walk.outcome = 'stopped_on_error';
              walk.error = String(error?.message ?? error);
              if (report.requests.at(-1)?.finishedAt === undefined) halted = true;
            }
            walk.idSha256 = createHash('sha256').update(JSON.stringify(walk.ids)).digest('hex');
            walk.uniqueIds = new Set(walk.ids).size;
          }
          report.finishedAt = new Date().toISOString();
          report.wallMs = performance.now() - started;
          report.totalBytes = totalBytes;
          writeFileSync('catalog-production-receipt.json', JSON.stringify(report, null, 2) + '\n');
          console.log('CATALOG_PRODUCTION_RECEIPT', JSON.stringify({ startedAt: report.startedAt, finishedAt: report.finishedAt, requests: report.requests.length, totalBytes, wallMs: report.wallMs, walks: report.walks.map(({ ids, ...walk }) => ({ ...walk, returnedIds: ids.length })) }));
          NODE
      - name: Upload bounded public receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-production-receipt
          path: catalog-production-receipt.json
          if-no-files-found: error
          retention-days: 7
