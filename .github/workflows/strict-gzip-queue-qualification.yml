name: Strict gzip queue qualification

# Validation-only. This adds a focused job without changing Validate, its
# thresholds, its draft behavior, deployment jobs, or publication permissions.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tests/qualification/strict-gzip/**"
      - ".github/workflows/strict-gzip-queue-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strict-gzip-queue-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  strict-gzip-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    # Proposed disposable local fixture. No provider binding or production data.
    # The exact official amd64 digest and fixed mapping require review before run.
    services:
      postgres:
        image: docker.io/library/postgres@sha256:66aafa11cf15800a3c94763f7e11d1e7b2e37e5e84bc4ce027cb6e1e4bfaf4df
        env:
          POSTGRES_DB: whole_owner_fixture
          POSTGRES_USER: qualification_admin
          POSTGRES_PASSWORD: synthetic-qualification-admin-only
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,noexec,nosuid,nodev,size=268435456
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U qualification_admin -d whole_owner_fixture"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
          --health-start-period 10s
    steps:
      - name: Check out qualification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: qualification-harness
          persist-credentials: false

      - name: Check out immutable base source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ea18c9e309063fb339cd8c8109e2e179c70f3289
          fetch-depth: 2 # Exact sole parent supplies the genuine unfixed control.
          path: qualification-base
          persist-credentials: false

      - name: Set up repository Node version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.2
          cache-dependency-path: qualification-base/package-lock.json

      - name: Test qualification safety policies without native fixtures
        shell: bash
        run: |
          set -euo pipefail
          harness="$GITHUB_WORKSPACE/qualification-harness/tests/qualification/strict-gzip"
          env -i PATH="$PATH" CI=true node "$harness/launch-policy.cases.ts"
          env -i PATH="$PATH" CI=true node "$harness/receipt-policy.cases.ts"
          env -i PATH="$PATH" CI=true node "$harness/thread-policy.cases.ts"
          env -i PATH="$PATH" CI=true node "$harness/raw-owner-fixture.cases.ts"
          env -i PATH="$PATH" CI=true node "$harness/postgres-owner-policy.cases.ts"
          env -i PATH="$PATH" CI=true node "$harness/owner-resource-policy.cases.ts"
          env -i PATH="$PATH" CI=true node "$harness/owner-build-evidence.cases.ts"
          env -i PATH="$PATH" CI=true node "$harness/owner-raw-build.cases.ts"
          env -i PATH="$PATH" CI=true node "$harness/owner-pg-identity.cases.ts"
          env -i PATH="$PATH" CI=true node "$harness/owner-overlay.cases.ts"
          env -i PATH="$PATH" CI=true node "$harness/owner-native-evidence.cases.ts"
          env -i PATH="$PATH" CI=true node "$harness/owner-test-evidence.cases.ts"
          env -i PATH="$PATH" CI=true node "$harness/owner-service.cases.ts"
          env -i PATH="$PATH" CI=true node "$harness/owner-diagnostics.cases.ts"
          env -i PATH="$PATH" CI=true node "$harness/owner-build-stages.cases.ts"
          env -i PATH="$PATH" CI=true node "$harness/optional-pg-import.cases.ts"
          env -i PATH="$PATH" CI=true node "$harness/input-only-public-diagnostics.cases.ts"
          env -i PATH="$PATH" CI=true node "$harness/owner-input-diagnostics.cases.ts"
          env -i PATH="$PATH" CI=true node "$harness/owner-discarded-input.cases.ts"
          env -i PATH="$PATH" CI=true node "$harness/owner-proof-reasons.cases.ts"
          env -i PATH="$PATH" CI=true node "$harness/chain-summary-workspace-probe.cases.ts"
          env -i PATH="$PATH" CI=true node "$harness/chain-summary-workspace-custody.cases.ts"
          env -i PATH="$PATH" CI=true node "$harness/failure-lifecycle-observer.cases.ts"
          env -i PATH="$PATH" CI=true node "$harness/failure-lifecycle-source.cases.ts"
          env -i PATH="$PATH" CI=true node "$harness/failure-postgres-policy.cases.ts"
          env -i PATH="$PATH" CI=true node "$harness/failure-postgres-private.cases.ts"
          env -i PATH="$PATH" CI=true node "$harness/failure-variants.cases.ts"
          env -i PATH="$PATH" CI=true node "$harness/failure-overlay.cases.ts"
          env -i PATH="$PATH" CI=true node "$harness/failure-test-evidence.cases.ts"
          env -i PATH="$PATH" CI=true node "$harness/failure-evidence.cases.ts"
          env -i PATH="$PATH" CI=true node "$harness/failure-publication.cases.ts"
          env -i PATH="$PATH" CI=true node "$harness/failure-replay-diagnostics.cases.ts"

      - name: Install the full pinned base lockfile without lifecycle scripts
        working-directory: qualification-base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ea18c9e309063fb339cd8c8109e2e179c70f3289
          install_home="$RUNNER_TEMP/strict-gzip-install-home"
          mkdir -p "$install_home"
          env -i PATH="$PATH" HOME="$install_home" CI=true \
            npm_config_cache="$RUNNER_TEMP/strict-gzip-npm-cache" \
            WRANGLER_SEND_METRICS=false CLOUDFLARE_AUTH_USE_KEYRING=false \
            npm ci --include=dev --ignore-scripts --no-audit --no-fund

      - name: Apply the reviewed patch only inside an isolated candidate
        shell: bash
        run: |
          set -euo pipefail
          base="$GITHUB_WORKSPACE/qualification-base"
          candidate="$RUNNER_TEMP/strict-gzip-candidate"
          harness="$GITHUB_WORKSPACE/qualification-harness/tests/qualification/strict-gzip"
          mkdir "$candidate"
          git -C "$base" archive ea18c9e309063fb339cd8c8109e2e179c70f3289 | tar -x -C "$candidate"
          ln -s "$base/node_modules" "$candidate/node_modules"
          git -C "$candidate" apply --check "$harness/integration.patch"
          git -C "$candidate" apply "$harness/integration.patch"
          env -i PATH="$PATH" CI=true node "$harness/owner-overlay.ts" "$candidate"
          git -C "$base" diff --exit-code
          variants="$RUNNER_TEMP/strict-gzip-failure-variants"
          mkdir "$variants"
          for phase in uninstrumented instrumented unfixed-instrumented; do
            env -i PATH="$PATH" CI=true node "$harness/failure-variants.ts" \
              "$candidate" "$variants/$phase" "$base" "$phase"
          done

      # Genuine source-bundle construction remains Wrangler deploy --dry-run.
      # No Worker is selected/uploaded/deployed. No provider credentials are
      # supplied. Unexpected guarded network attempts fail qualification.
      # Every Node child shape is allowlisted and receives the guard; native
      # compiler/runtime paths and digests are checked at every launch.
      # The Node API preload is not native-socket/kernel containment.
      - name: Verify the Actions-owned local PostgreSQL service identity
        shell: bash
        env:
          OWNER_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          env -i PATH="$PATH" CI=true node \
            "$GITHUB_WORKSPACE/qualification-harness/tests/qualification/strict-gzip/owner-service.ts" \
            "$OWNER_SERVICE_ID" "$RUNNER_TEMP/whole-owner-service.json"

      - name: Verify pinned sources and run guarded focused host/native tests
        shell: bash
        env:
          DECODER_QUALIFICATION_RECEIPTS: ${{ runner.temp }}/strict-gzip-receipts/baseline
        run: |
          set -euo pipefail
          env -i PATH="$PATH" CI=true DECODER_QUALIFICATION_RECEIPTS="$DECODER_QUALIFICATION_RECEIPTS" OWNER_SERVICE_RECEIPT="$RUNNER_TEMP/whole-owner-service.json" \
            node "$GITHUB_WORKSPACE/qualification-harness/tests/qualification/strict-gzip/run.ts" \
            "$RUNNER_TEMP/strict-gzip-candidate" \
            "$GITHUB_WORKSPACE/qualification-base"

      - name: Run separate fixed-source and genuine unfixed failure phases
        shell: bash
        run: |
          set -euo pipefail
          harness="$GITHUB_WORKSPACE/qualification-harness/tests/qualification/strict-gzip"
          for phase in uninstrumented instrumented unfixed-instrumented; do
            env -i PATH="$PATH" CI=true \
              DECODER_QUALIFICATION_RECEIPTS="$RUNNER_TEMP/strict-gzip-receipts/$phase" \
              OWNER_SERVICE_RECEIPT="$RUNNER_TEMP/whole-owner-service.json" \
              node "$harness/failure-run.ts" \
              "$RUNNER_TEMP/strict-gzip-failure-variants/$phase" \
              "$RUNNER_TEMP/strict-gzip-candidate" \
              "$GITHUB_WORKSPACE/qualification-base" "$phase"
          done

      - name: Validate and redact publication artifacts
        id: public_receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          env -i PATH="$PATH" CI=true node \
            "$GITHUB_WORKSPACE/qualification-harness/tests/qualification/strict-gzip/failure-public-receipts.ts" \
            "$RUNNER_TEMP/strict-gzip-receipts" \
            "$RUNNER_TEMP/strict-gzip-public-receipts" \
            "$RUNNER_TEMP/strict-gzip-candidate" \
            "$GITHUB_WORKSPACE/qualification-base" \
            "$RUNNER_TEMP/strict-gzip-failure-variants"

      - name: Retain only bounded sanitized qualification artifacts
        if: always() && steps.public_receipts.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strict-gzip-queue-qualification-${{ github.run_id }}
          path: ${{ runner.temp }}/strict-gzip-public-receipts/
          retention-days: 7
          if-no-files-found: error
