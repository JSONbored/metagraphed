name: Payload compression stream native qualification

on:
  push:
    branches:
      - ci/payload-stream-qualification-20261019

permissions:
  contents: read

concurrency:
  group: payload-stream-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Fetch exact control source
        run: git fetch --no-tags --depth=1 origin 62a5a7a6dd55de5263d79028605ebdc2bbaed542
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install existing dependencies
        uses: ./.github/actions/install-deps
      - name: Native formatting
        run: npx prettier --write src/chain-detail-payloads.ts tests/chain-detail-payloads.test.ts .github/scripts/qualify-payload-stream.ts .github/scripts/payload-stream-worker.ts .github/workflows/payload-stream-qualification.yml
      - name: Focused lint
        run: npx eslint src/chain-detail-payloads.ts tests/chain-detail-payloads.test.ts
      - name: Cold typecheck
        run: npm run typecheck -- --incremental false
      - name: Workflow policy
        run: npm run validate:workflows
      - name: Existing fixture build
        env:
          METAGRAPH_PRESERVE_PROBE_HEALTH: "1"
        run: npm run build
      - name: Actual baseline, candidate and workerd equivalence
        env:
          WRANGLER_SEND_METRICS: "false"
          WRANGLER_WRITE_LOGS: "false"
        run: node .github/scripts/qualify-payload-stream.ts
      - name: Retain only qualified source and synthetic receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: payload-stream-native-source
          path: |
            src/chain-detail-payloads.ts
            tests/chain-detail-payloads.test.ts
            payload-stream-reports/source-receipt.json
            payload-stream-reports/native-equivalence.json
          retention-days: 1
          if-no-files-found: error
      - name: Download actual persisted artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: payload-stream-native-source
          path: payload-stream-artifact-readback
      - name: Verify exact persisted members and hashes
        run: node .github/scripts/qualify-payload-stream.ts --verify-uploaded
