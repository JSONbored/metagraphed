name: Native payload base64 qualification

on:
  push:
    branches:
      - ci/native-base64-qualification-20261020

permissions:
  contents: read

concurrency:
  group: native-base64-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Fetch exact control source
        run: git fetch --no-tags --depth=1 origin 0a65fcffd51b0a6a2b9757905be02c1d8b859e6c
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install existing dependencies
        uses: ./.github/actions/install-deps
      - name: Verify fixture hashes and overlay only this disposable hosted checkout
        run: node .github/scripts/qualify-native-base64.ts --stage-candidate
      - name: Native formatting
        run: npx prettier --write src/chain-detail-native-payloads.ts tests/chain-detail-native-payloads.test.ts .github/scripts/qualify-native-base64.ts .github/scripts/native-base64-worker.ts .github/workflows/native-base64-qualification.yml
      - name: Focused lint
        run: npx eslint src/chain-detail-native-payloads.ts tests/chain-detail-native-payloads.test.ts
      - name: Cold typecheck
        run: npm run typecheck -- --incremental false
      - name: Workflow policy
        run: npm run validate:workflows
      - name: Existing fixture build
        env:
          METAGRAPH_PRESERVE_PROBE_HEALTH: "1"
        run: npm run build
      - name: Baseline compatibility, candidate regressions and workerd equivalence
        env:
          WRANGLER_SEND_METRICS: "false"
          WRANGLER_WRITE_LOGS: "false"
        run: node .github/scripts/qualify-native-base64.ts
      - name: Retain only qualified source and synthetic receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-base64-source
          path: |
            src/chain-detail-native-payloads.ts
            tests/chain-detail-native-payloads.test.ts
            native-base64-reports/source-receipt.json
            native-base64-reports/native-equivalence.json
          retention-days: 1
          if-no-files-found: error
      - name: Download actual persisted artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-base64-source
          path: native-base64-artifact-readback
      - name: Verify exact persisted members and hashes
        run: node .github/scripts/qualify-native-base64.ts --verify-uploaded
