name: Raw capture streaming full carrier native formatting

on:
  push:
    branches: [ci/raw-capture-streaming-full-format-20261020]

permissions:
  contents: read

concurrency:
  group: raw-capture-full-format-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: github.ref == 'refs/heads/ci/raw-capture-streaming-full-format-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact canonical source carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup exact native Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.2
      - name: Install locked formatter without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Obtain bounded native carrier formatting
        id: format
        run: node .github/scripts/format-raw-capture-full-validation.ts
      - name: Retain exact formatted public carrier files
        if: always() && (steps.format.outcome == 'success' || steps.format.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raw-capture-streaming-full-format-${{ github.run_attempt }}-${{ steps.format.outcome }}
          path: |
            .github/scripts/apply-raw-capture-full-validation.ts
            .github/scripts/report-raw-capture-full-validation.ts
            .github/scripts/format-raw-capture-full-validation.ts
            .github/workflows/raw-capture-full-validation.yml
            .github/workflows/raw-capture-full-format.yml
            .github/fixtures/raw-capture-full-validation/manifest.json
            .github/fixtures/raw-capture-full-validation/commands.json
            tmp/raw-capture-full-format/format-receipt.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
