name: Sync weekly digests

# #8705: generates the previous ISO week's digests and commits them.
#
# Weekly on Monday, because an ISO week ends Sunday midnight UTC and a digest
# for a week still in progress would publish "two releases" on Tuesday and be
# wrong by Friday. src/weekly-digest-store.ts enforces that independently
# (isWeekComplete) -- the schedule just means the run happens when there is
# something new to find.
#
# The store is APPEND-ONLY: a week already in registry/generated/digests.json is
# never regenerated, so a published digest cannot silently change when a late
# feed item lands in its window (#8705 requirement 3). A correction is a new
# dated revision, which is a deliberate edit, not something this workflow can do
# by accident.
#
# Reads our own feed API rather than the database: per-subnet items are merged
# in the Worker from committed signals, published artifacts, and D1, and the
# feed endpoint is the only thing that already IS that merge. See the header of
# scripts/refresh-digests.ts, and ADR 0014/0015 for why this does not go in
# indexer-rs.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-weekly-digests
  cancel-in-progress: false

jobs:
  sync:
    name: Generate last week's digests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Tolerant by design: the script swallows its own failures and leaves the
      # last committed digests intact, so a feed outage costs a week's pages,
      # never the workflow. A subject whose feed failed stays a candidate,
      # because nothing was written for it.
      - name: Generate digests
        run: node scripts/refresh-digests.ts --write

      # content/news/** is generated FROM the store, and validate.yml's "Build
      # digest pages (drift check)" holds the two in agreement. Without this
      # step the sync PR would carry a new digest with no page for it and fail
      # that check on arrival -- the automation would have been broken from its
      # very first run.
      - name: Regenerate the digest pages
        working-directory: apps/ui
        run: node scripts/generate-digest-pages.ts

      - name: Check whether any digest was added
        id: diff
        run: |
          if git diff --quiet -- registry/generated/digests.json apps/ui/content/news; then
            echo "no new digests this run"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize what was added
        if: steps.diff.outputs.changed == 'true'
        id: summary
        run: |
          count() {
            node -e '
              const fs = require("node:fs");
              const doc = JSON.parse(fs.readFileSync(0, "utf8"));
              process.stdout.write(String((doc.digests || []).length));
            '
          }
          before=$(git show HEAD:registry/generated/digests.json 2>/dev/null | count || echo 0)
          after=$(count < registry/generated/digests.json)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"

      - name: Open sync PR (no-op if nothing new)
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        id: pr
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/sync-weekly-digests
          delete-branch: true
          add-paths: |
            registry/generated/digests.json
            apps/ui/content/news
          title: "chore(digest): add weekly digests (${{ steps.summary.outputs.before }} -> ${{ steps.summary.outputs.after }})"
          commit-message: "chore(digest): add weekly digests (${{ steps.summary.outputs.before }} -> ${{ steps.summary.outputs.after }})"
          body: |
            New weekly digests for completed ISO weeks that cleared the substantive-item threshold. Stored digests: `${{ steps.summary.outputs.before }}` -> `${{ steps.summary.outputs.after }}`.

            Every sentence is generated by counting and dating the week's feed items, and every claim cites the items it rests on — `buildWeeklyDigest` rejects a draft that does not.

            **The store is append-only.** This PR should only ever ADD entries. If the diff modifies or removes an existing digest, something is wrong: a published digest is not supposed to be able to change, and that is the property to check before merging.
          labels: |
            automation
      # #233 interim: merge the bot PR itself once its own checks are green,
      # replacing the daily manual merge. Deliberately the RELEASE_PLEASE_TOKEN
      # (a real PAT) rather than GITHUB_TOKEN: a GITHUB_TOKEN merge would not
      # trigger push-to-main workflows (the merge-triggered fast registry sync,
      # the version-bump lanes), silently detaching everything that reacts to
      # these merges. A failed or missing check leaves the PR open for a human
      # and turns this run red, which is the alert.
      - name: Auto-merge when checks are green
        if: steps.pr.outputs.pull-request-number
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          pr="${{ steps.pr.outputs.pull-request-number }}"
          # Checks register within moments of the branch push; give them a
          # beat so --watch sees the run instead of "no checks reported".
          sleep 60
          gh pr checks "$pr" --watch --fail-fast
          gh pr merge "$pr" --squash
