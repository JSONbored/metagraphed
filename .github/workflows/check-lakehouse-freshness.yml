# Did every lakehouse table receive a snapshot recently enough? (#11048)
#
# Nineteen of the 26 tables in `chain` stopped on 2026-08-02 and it went
# unreported for eleven days. Not because it was hard to see -- the catalog
# records every table's newest snapshot in its own metadata -- but because
# nothing was looking. The routes over those tables stayed green the whole
# time: the hot tier answers first, and a frozen table returns rows perfectly
# happily.
#
# DAILY, not hourly. The tightest bound here is six hours (the decode lanes),
# and a check that runs more often than the thing it watches only adds noise.
name: check-lakehouse-freshness

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      check_only:
        description: "Check freshness without external notifications"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: check-lakehouse-freshness
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Check every archived table's D1 snapshot receipt
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          LIVE_ALERT_WEBHOOK_URL: ${{ secrets.LIVE_ALERT_WEBHOOK_URL }}
          CHECK_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.check_only }}
          REPORT_PATH: ${{ runner.temp }}/lakehouse-freshness-report.json
        # No `tee`: piping a report into tee discards the script's exit status,
        # which is how a scheduled sweep in this repo came to be unable to fail.
        run: |
          args=(--report "$REPORT_PATH")
          case "$CHECK_ONLY" in
            true) args+=(--check-only) ;;
            false) ;;
            *) echo "Invalid check-only mode" >&2; exit 1 ;;
          esac
          npm run check:lakehouse-freshness -- "${args[@]}"
      - name: Retain sanitized freshness report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lakehouse-freshness-report
          path: ${{ runner.temp }}/lakehouse-freshness-report.json
          retention-days: 7
          if-no-files-found: error
