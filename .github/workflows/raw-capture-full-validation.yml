name: Exact presubmit with qualified failure reporting

on:
  push:
    branches: [ci/raw-capture-presubmit-reporting-repair-20261020]

permissions:
  contents: read

concurrency:
  group: exact-presubmit-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_FULL_QUALIFICATION: "true"
  FULL_VALIDATION_MANIFEST_SHA256: cc30c4ddfdf0a36634d9a3876c0247426db26d6fa907d867d05e33a3dff9b92e
  FULL_VALIDATION_COMMANDS_SHA256: 56b45658546a8e448a8bb56fb962a7960b0af3a2bf011619881ffa0872aa41a0
  WRANGLER_SEND_METRICS: "false"
  WRANGLER_WRITE_LOGS: "false"

jobs:
  presubmit:
    name: exact named presubmit checks
    runs-on: ubuntu-latest
    timeout-minutes: 45 # exact pipeline includes dry-run probes and the ordinary suite
    env:
      QUALIFICATION_JOB_ID: validate
    steps:
      - name: Checkout exact source-only carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup exact qualification Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Setup native dry-run Python dependency launcher
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Apply exact qualified runner-only candidate
        id: overlay
        run: node .github/scripts/apply-raw-capture-full-validation.ts
      - name: Install through the native locked dependency action
        uses: ./.github/actions/install-deps
      - name: Build the native validator inputs
        env:
          METAGRAPH_PRESERVE_PROBE_HEALTH: "1"
        run: node .github/scripts/report-raw-capture-full-validation.ts run validate-12
      - name: Prepare the same local R2 staging shape as the exact pipeline
        run: node .github/scripts/report-raw-capture-full-validation.ts run validate-presubmit-prepare-r2
      - name: Generate R2 manifest with the native prerequisite
        run: node .github/scripts/report-raw-capture-full-validation.ts run validate-16
      - name: Run exact required npm wrapper
        env:
          BASE_SHA: ${{ steps.overlay.outputs.canonical_base }}
          HEAD_SHA: ${{ steps.overlay.outputs.candidate_commit }}
        run: node .github/scripts/report-raw-capture-full-validation.ts run validate-presubmit-check
      - name: Check whitespace in working, staged and clean candidate diffs
        if: always() && steps.overlay.outcome == 'success'
        env:
          BASE_SHA: ${{ steps.overlay.outputs.canonical_base }}
          HEAD_SHA: ${{ steps.overlay.outputs.candidate_commit }}
        run: node .github/scripts/report-raw-capture-full-validation.ts run validate-presubmit-diff
      - name: Curate exact source and command receipts
        if: always() && steps.overlay.outcome == 'success'
        env:
          QUALIFICATION_JOB_STATUS: ${{ job.status }}
        run: node .github/scripts/report-raw-capture-full-validation.ts finalize
      - name: Retain only bounded same-attempt presubmit evidence
        if: always() && steps.overlay.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raw9-exact-presubmit-reporting-repair-${{ github.run_attempt }}
          path: tmp/raw-capture-full-validation/upload/validate/
          retention-days: 1
          if-no-files-found: error
