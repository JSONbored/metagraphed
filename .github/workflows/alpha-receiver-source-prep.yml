name: Alpha receiver source preparation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Format only receiver source changes
        run: |
          git fetch --depth=1 origin ae554a2c70d3ae4a9b37fa87a04ab2606f0a1238
          git diff --name-only -z ae554a2c70d3ae4a9b37fa87a04ab2606f0a1238 HEAD -- src workers tests docs | xargs -0 npx prettier --write --ignore-unknown
          git diff --binary > /tmp/receiver-native-format.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: receiver-native-format
          path: /tmp/receiver-native-format.patch
          if-no-files-found: error
      - name: Typecheck receiver composition
        run: npm run typecheck
      - name: Test receiver contracts
        run: npx vitest run tests/alpha-share-value.test.ts tests/alpha-snapshot-d1.test.ts tests/alpha-capture-reader.test.ts tests/alpha-canonical-readers.test.ts tests/self-stake-snapshot-d1.test.ts tests/owner-capture-positions.test.ts
