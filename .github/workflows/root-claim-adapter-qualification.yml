name: Root claim adapter qualification

on:
  push:
    branches:
      - ci/root-claim-adapter-qualification-20261018

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 5
          persist-credentials: false

      - name: Setup existing Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install existing workspace dependencies
        uses: ./.github/actions/install-deps

      - name: Build existing workspace type declarations
        run: |
          npm run build --workspace=packages/client
          npm run build --workspace=packages/ui-kit
          npm run build --workspace=packages/chain-summaries
          git diff --exit-code -- packages/client/dist packages/ui-kit/dist packages/chain-summaries/dist

      - name: Check three-file formatting
        id: format
        working-directory: apps/ui
        run: npx prettier --check src/lib/metagraphed/queries.ts src/lib/metagraphed/types.ts src/lib/metagraphed/queries.account-root-claim.test.ts

      - name: Retain native formatting diff
        if: ${{ !cancelled() && steps.format.outcome == 'failure' }}
        working-directory: apps/ui
        run: |
          npx prettier --write src/lib/metagraphed/queries.ts src/lib/metagraphed/types.ts src/lib/metagraphed/queries.account-root-claim.test.ts
          git diff -- src/lib/metagraphed/queries.ts src/lib/metagraphed/types.ts src/lib/metagraphed/queries.account-root-claim.test.ts

      - name: Check required ratchet formatting and lint
        if: ${{ !cancelled() }}
        run: |
          npx prettier --check scripts/validate-unreferenced-exports.ts
          npx eslint scripts/validate-unreferenced-exports.ts

      - name: Lint three-file source
        if: ${{ !cancelled() }}
        working-directory: apps/ui
        run: npx eslint src/lib/metagraphed/queries.ts src/lib/metagraphed/types.ts src/lib/metagraphed/queries.account-root-claim.test.ts

      - name: Prove original adapter fails the same runtime regressions
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { execFileSync, spawnSync } from "node:child_process";
          import { readFileSync, writeFileSync } from "node:fs";
          const base = "712f19e88bd259f7158bd57e6ba5f8cab80fbb7b";
          const files = ["apps/ui/src/lib/metagraphed/queries.ts", "apps/ui/src/lib/metagraphed/types.ts"];
          const fixed = new Map(files.map((file) => [file, readFileSync(file)]));
          try {
            for (const file of files) {
              writeFileSync(file, execFileSync("git", ["show", base + ":" + file]));
            }
            const result = spawnSync("npm", [
              "test", "--workspace=apps/ui", "--",
              "src/lib/metagraphed/queries.account-root-claim.test.ts",
              "--reporter=junit", "--outputFile=/tmp/root-claim-adapter-before.xml"
            ], { encoding: "utf8" });
            process.stdout.write(result.stdout ?? "");
            process.stderr.write(result.stderr ?? "");
            assert.equal(result.error, undefined, "baseline test process must start");
            assert.equal(result.status, 1, "original adapter must fail assertions");
            const report = readFileSync("/tmp/root-claim-adapter-before.xml", "utf8");
            assert.match(report, /<testsuites[^>]*tests="12"/);
            assert.match(report, /<testsuites[^>]*failures="10"/);
            assert.match(report, /<testsuites[^>]*errors="0"/);
            assert.equal((report.match(/<testcase\b/g) ?? []).length, 12);
            assert.equal((report.match(/<failure\b/g) ?? []).length, 10);
            assert.equal((report.match(/<error\b/g) ?? []).length, 0);
            assert.match(report, /AssertionError/);
            console.log(JSON.stringify({ baseline: base, tests: 12, assertion_failures: 10, errors: 0 }));
          } finally {
            for (const [file, content] of fixed) writeFileSync(file, content);
          }
          NODE

      - name: Test fixed adapter fixtures
        if: ${{ !cancelled() }}
        run: |
          npm test --workspace=apps/ui -- src/lib/metagraphed/queries.account-root-claim.test.ts --reporter=junit --outputFile=/tmp/root-claim-adapter-fixed.xml
          cat /tmp/root-claim-adapter-fixed.xml

      - name: Typecheck existing UI
        if: ${{ !cancelled() }}
        run: npm run typecheck --workspace=apps/ui

      - name: Check unreferenced modules
        if: ${{ !cancelled() }}
        run: npm run validate:unreferenced-modules

      - name: Check unreferenced export ratchet
        if: ${{ !cancelled() }}
        run: npm run validate:unreferenced-exports

      - name: Retain regression reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: root-claim-adapter-qualification
          path: /tmp/root-claim-adapter-*.xml
          if-no-files-found: error
          retention-days: 7
