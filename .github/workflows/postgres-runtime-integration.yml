name: PostgreSQL runtime integration

on:
  pull_request:
    paths:
      - .github/workflows/postgres-runtime-integration.yml
      - .github/actions/install-deps/**
      - .nvmrc
      - package.json
      - package-lock.json
      # Include future transitive runtime imports as well as today's closure.
      - src/**
      - tests/pg-store-runtime.pg18.ts
      - tests/postgres-retained-schema.pg18.ts
      - tests/postgres-registry-schema.pg18.ts
      - tests/retained-blocks-runtime.pg18.ts
      - tests/generated-artifact-runtime.pg18.ts
      - tests/pg-kv-runtime.pg18.ts
      - tests/lane-health-runtime.pg18.ts
      - tests/native-api-process.pg18.ts
      - tests/helpers/pg18-fixture.ts
      - migrations/postgres/**
  push:
    branches: [main]
    paths:
      - .github/workflows/postgres-runtime-integration.yml
      - .github/actions/install-deps/**
      - .nvmrc
      - package.json
      - package-lock.json
      - src/**
      - tests/pg-store-runtime.pg18.ts
      - tests/postgres-retained-schema.pg18.ts
      - tests/postgres-registry-schema.pg18.ts
      - tests/retained-blocks-runtime.pg18.ts
      - tests/generated-artifact-runtime.pg18.ts
      - tests/pg-kv-runtime.pg18.ts
      - tests/lane-health-runtime.pg18.ts
      - tests/native-api-process.pg18.ts
      - tests/helpers/pg18-fixture.ts
      - migrations/postgres/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-runtime-integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pg18:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Official postgres:18.6-bookworm linux/amd64 manifest, verified from Docker Hub.
      PG18_IMAGE: postgres@sha256:41a369edc91d9bdd7a58be6bc71ea0f8f7a3f49e82818a9f0829021ea7840b7c
      PG18_CONTAINER: metagraphed-pg18-fixture
      METAGRAPH_PG18_URL: postgresql://metagraphed_fixture:fixture-only@127.0.0.1:54329/metagraphed_pg18_fixture
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install fixture dependencies
        timeout-minutes: 5
        uses: ./.github/actions/install-deps
      - name: Start bounded disposable PostgreSQL
        timeout-minutes: 3
        run: |
          set -euo pipefail
          timeout 120 docker pull --platform linux/amd64 "$PG18_IMAGE"
          timeout 20 docker run --detach --platform linux/amd64 --name "$PG18_CONTAINER" \
            --cpus 2 --memory 1g --memory-swap 1g --pids-limit 128 \
            --read-only --shm-size 64m \
            --tmpfs /var/lib/postgresql:rw,size=512m \
            --tmpfs /var/run/postgresql:rw,size=8m \
            --tmpfs /tmp:rw,size=8m \
            --publish 127.0.0.1:54329:5432 \
            --env POSTGRES_USER=metagraphed_fixture \
            --env POSTGRES_PASSWORD=fixture-only \
            --env POSTGRES_DB=metagraphed_pg18_fixture \
            "$PG18_IMAGE" \
            -c max_connections=12 -c shared_buffers=32MB \
            -c max_wal_size=64MB -c min_wal_size=32MB
          for _ in $(seq 1 30); do
            if timeout 1 docker exec "$PG18_CONTAINER" \
              pg_isready --host 127.0.0.1 --username metagraphed_fixture --dbname metagraphed_pg18_fixture; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Verify fixture image and containment
        timeout-minutes: 1
        run: |
          set -euo pipefail
          expected_image_id=$(docker image inspect --format '{{.Id}}' "$PG18_IMAGE")
          running_image_id=$(docker inspect --format '{{.Image}}' "$PG18_CONTAINER")
          test "$running_image_id" = "$expected_image_id"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}} {{.HostConfig.Memory}} {{.HostConfig.MemorySwap}} {{.HostConfig.NanoCpus}} {{.HostConfig.PidsLimit}}' "$PG18_CONTAINER")" = 'true 1073741824 1073741824 2000000000 128'
          test "$(docker inspect --format '{{(index (index .NetworkSettings.Ports "5432/tcp") 0).HostIp}}' "$PG18_CONTAINER")" = 127.0.0.1
          test "$(docker inspect --format '{{index .HostConfig.Tmpfs "/var/lib/postgresql"}}' "$PG18_CONTAINER")" = rw,size=512m
          docker image inspect --format '{{json .RepoDigests}}' "$PG18_IMAGE"
      - name: Exercise the real pool and store contracts
        timeout-minutes: 2
        run: node --experimental-strip-types --test --test-concurrency=1 --test-timeout=30000 tests/pg-store-runtime.pg18.ts tests/postgres-retained-schema.pg18.ts tests/retained-blocks-runtime.pg18.ts tests/generated-artifact-runtime.pg18.ts tests/pg-kv-runtime.pg18.ts tests/postgres-registry-schema.pg18.ts tests/lane-health-runtime.pg18.ts tests/native-api-process.pg18.ts
      - name: Show failed fixture logs
        if: failure()
        run: timeout 10 docker logs --tail 50 "$PG18_CONTAINER" || true
      - name: Remove the task's fixture container
        if: always()
        run: |
          if timeout 5 docker container inspect "$PG18_CONTAINER" >/dev/null 2>&1; then
            timeout 20 docker rm --force --volumes "$PG18_CONTAINER"
          fi
