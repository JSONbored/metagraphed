name: UI artifact policy native formatting

on:
  push:
    branches:
      - ci/ui-diagnostics-artifact-policy-format-20261018

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup existing Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install existing workspace dependencies
        uses: ./.github/actions/install-deps
      - name: Obtain native formatter output
        run: |
          npx prettier --write tests/ui-diagnostics-artifact-policy.test.ts
          git diff -- tests/ui-diagnostics-artifact-policy.test.ts
