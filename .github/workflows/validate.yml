name: Validate

on:
  push:
    branches: [ci/publication-guard-qualification-20261018]

permissions:
  contents: read

concurrency:
  group: publication-guard-qualification
  cancel-in-progress: false

jobs:
  qualify:
    if: github.repository == 'JSONbored/metagraphed' && github.ref == 'refs/heads/ci/publication-guard-qualification-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
          cache: npm

      - name: Restore final validation workflow before qualification
        run: git show 712f19e88bd259f7158bd57e6ba5f8cab80fbb7b:.github/workflows/validate.yml > .github/workflows/validate.yml

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit

      - name: Format candidate files and print exact formatting diff
        run: |
          npx --no-install prettier --write .github/workflows/publish-cloudflare.yml scripts/validate-workflows.ts tests/publish-workflow-branch-guard.test.ts
          git diff -- .github/workflows/publish-cloudflare.yml scripts/validate-workflows.ts tests/publish-workflow-branch-guard.test.ts
          git diff --check

      - name: Lint candidate script and test
        run: npx --no-install eslint scripts/validate-workflows.ts tests/publish-workflow-branch-guard.test.ts

      - name: Prove the original workflow fails the regression
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/publish-cloudflare.yml "$RUNNER_TEMP/publication-candidate.yml"
          git show 712f19e88bd259f7158bd57e6ba5f8cab80fbb7b:.github/workflows/publish-cloudflare.yml > .github/workflows/publish-cloudflare.yml
          set +e
          npx --no-install vitest run tests/publish-workflow-branch-guard.test.ts --reporter=verbose --testNamePattern="production publication refuses branch and tag dispatches before any write decision" > "$RUNNER_TEMP/publication-before.log" 2>&1
          before_status=$?
          set -e
          cp "$RUNNER_TEMP/publication-candidate.yml" .github/workflows/publish-cloudflare.yml
          cat "$RUNNER_TEMP/publication-before.log"
          test "$before_status" -eq 1
          grep -F "AssertionError" "$RUNNER_TEMP/publication-before.log"
          grep -F "refs/heads/fix/reviewed-change" "$RUNNER_TEMP/publication-before.log"
          echo "Original workflow failed the branch publication regression as expected."

      - name: Test publication guard and validator mutations
        run: npx --no-install vitest run tests/publish-workflow-branch-guard.test.ts --reporter=verbose

      - name: Validate final workflow inventory
        run: npm run validate:workflows

      - name: Cold whole-project typecheck
        run: npx --no-install tsc --noEmit --incremental false

      - name: Check candidate formatting
        run: npx --no-install prettier --check .github/workflows/publish-cloudflare.yml scripts/validate-workflows.ts tests/publish-workflow-branch-guard.test.ts
