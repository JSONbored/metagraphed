name: Validate

on:
  push:
    branches: [ci/dependency-audit-evidence-20261018]

permissions:
  contents: read

jobs:
  dependency-audit-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
          cache-dependency-path: package-lock.json
      - name: Resolve compatible dependency security updates
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          if (pkg.devDependencies["@graphql-codegen/cli"] !== "^7.2.0") throw new Error("Unexpected Codegen baseline");
          Object.assign(pkg.devDependencies, { "@graphql-codegen/cli": "^7.4.6", "@graphql-codegen/typescript": "^6.1.1", "@graphql-codegen/typescript-resolvers": "^6.1.1", sharp: "^0.35.5" });
          writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          NODE
          npm update @graphql-codegen/cli @graphql-codegen/typescript @graphql-codegen/typescript-resolvers sharp @fastify/busboy smol-toml --package-lock-only --ignore-scripts --no-audit
          mkdir -p "$RUNNER_TEMP/dependency-audit"
          cp package.json package-lock.json "$RUNNER_TEMP/dependency-audit/"
          git diff -- package.json package-lock.json > "$RUNNER_TEMP/dependency-audit/resolved.patch"
      - name: Install exact lock without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit
      - name: Retain exact dependency advisories and chains
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from "node:child_process";
          import { mkdirSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const output = join(process.env.RUNNER_TEMP, "dependency-audit");
          mkdirSync(output, { recursive: true });
          const metadata = { source: process.env.GITHUB_SHA, repository: process.env.GITHUB_REPOSITORY, node: process.version, npm: spawnSync("npm", ["--version"], { encoding: "utf8" }).stdout.trim() };
          console.log("AUDIT_METADATA " + JSON.stringify(metadata));
          writeFileSync(join(output, "metadata.json"), JSON.stringify(metadata, null, 2) + "\n");
          const scopes = [["all",["--workspaces","--include-workspace-root"]],["root-runtime",["--omit=dev","--workspaces=false"]],["ui-runtime",["--omit=dev","--workspace=apps/ui"]]];
          let packages = new Set();
          for (const [name, args] of scopes) {
            const result = spawnSync("npm", ["audit", "--json", ...args], { encoding: "utf8", maxBuffer: 16 * 1024 * 1024 });
            writeFileSync(join(output, name + ".json"), result.stdout);
            writeFileSync(join(output, name + ".stderr.txt"), result.stderr);
            const report = JSON.parse(result.stdout);
            if (result.error || ![0, 1].includes(result.status) || report.error || !report.metadata || !report.vulnerabilities) throw new Error("Audit did not produce a complete report: " + name);
            console.log("AUDIT_" + name + " " + JSON.stringify({ exit_code: result.status, ...report }));
            for (const value of Object.keys(report.vulnerabilities)) packages.add(value);
          }
          for (const name of [...packages].sort()) {
            const result = spawnSync("npm", ["explain", name, "--json"], { encoding: "utf8", maxBuffer: 16 * 1024 * 1024 });
            writeFileSync(join(output, "explain-" + name.replaceAll("/", "__") + ".json"), result.stdout);
            if (result.error || result.status !== 0) throw new Error("Dependency explanation failed: " + name);
            console.log("EXPLAIN_" + name + " " + JSON.stringify(JSON.parse(result.stdout)));
          }
          NODE
      - name: Verify the actual patched dependency leaves
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          const floors = { "@fastify/busboy": "3.2.2", "@graphql-tools/utils": "12.0.1", "@graphql-tools/url-loader": "9.1.9", "@graphql-tools/executor-legacy-ws": "1.1.35", sharp: "0.35.5", "smol-toml": "1.9.0" };
          function atLeast(version, floor) { const a = version.split(".").map(Number), b = floor.split(".").map(Number); for (let i = 0; i < 3; i++) { if (!Number.isInteger(a[i])) return false; if (a[i] !== b[i]) return a[i] > b[i]; } return true; }
          for (const [name, floor] of Object.entries(floors)) {
            const matches = Object.entries(lock.packages).filter(([path]) => path.endsWith("node_modules/" + name));
            if (!matches.length || matches.some(([, item]) => !atLeast(item.version, floor))) throw new Error("Unpatched dependency: " + name);
            console.log("PATCHED_" + name + " " + JSON.stringify(matches.map(([path, item]) => ({ path, version: item.version }))));
          }
          NODE
      - name: Qualify code generation and existing security consumers
        run: |
          npm run validate:graphql-types-drift
          npm exec -- vitest run tests/shell-quote-consumers.test.ts tests/build-logo-thumbnails.test.ts tests/logo-sharing-ico.test.ts tests/og-logo-raster.test.ts
          npm run typecheck
          npm run validate:unreferenced-modules
      - name: Upload dependency diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-audit-diagnostic
          path: ${{ runner.temp }}/dependency-audit/
          retention-days: 7
          if-no-files-found: error
