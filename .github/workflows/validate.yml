name: D1 annotation source qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Native formatting
        run: |
          npx prettier --write scripts/lib/d1-migration-ledger.ts tests/d1-admin.test.ts tests/d1-migration-ledger.test.ts tests/d1-schema-snapshot.test.ts docs/d1-maintenance.md
          git diff -- scripts/lib/d1-migration-ledger.ts tests/d1-admin.test.ts tests/d1-migration-ledger.test.ts tests/d1-schema-snapshot.test.ts docs/d1-maintenance.md
      - name: Prove the old classifier loses the safe diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/d1-annotation
          cp scripts/lib/d1-migration-ledger.ts "$RUNNER_TEMP/candidate-ledger.ts"
          git show 7afb1a5fb1aa00eb0dd261861d9f56f59c3db80d:scripts/lib/d1-migration-ledger.ts > scripts/lib/d1-migration-ledger.ts
          set +e
          npx vitest run tests/d1-admin.test.ts tests/d1-migration-ledger.test.ts tests/d1-schema-snapshot.test.ts --reporter=json --outputFile=test-results/d1-annotation/baseline.json
          baseline_exit=$?
          set -e
          mv "$RUNNER_TEMP/candidate-ledger.ts" scripts/lib/d1-migration-ledger.ts
          test "$baseline_exit" -eq 1
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync("test-results/d1-annotation/baseline.json", "utf8"));
          assert.equal(report.numFailedTests, 4);
          assert.equal(report.numPassedTests, 21);
          const failed = report.testResults.flatMap((file) => file.assertionResults).filter((test) => test.status === "failed");
          assert.equal(failed.filter((test) => test.fullName.includes("D1 HTTP diagnostics expose only an allowlisted code")).length, 1);
          assert.equal(failed.filter((test) => test.fullName.includes("CLI diagnostics retain only the exact allowlisted provider-code suffix")).length, 1);
          assert.equal(failed.filter((test) => test.fullName.includes("the actual verification CLI retains only the safe provider code")).length, 2);
          console.log("BASELINE: four expected safe-code-loss failures, 21 controls passed.");
          NODE
      - name: Qualify the fixed classifier and actual child CLI
        run: |
          npx vitest run tests/d1-admin.test.ts tests/d1-migration-ledger.test.ts tests/d1-schema-snapshot.test.ts --reporter=json --outputFile=test-results/d1-annotation/candidate.json
          npx eslint scripts/lib/d1-migration-ledger.ts tests/d1-admin.test.ts tests/d1-migration-ledger.test.ts tests/d1-schema-snapshot.test.ts
          npm run typecheck
          git diff --check
      - name: Pin the qualification receipt
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";
          const root = "test-results/d1-annotation";
          const candidate = JSON.parse(readFileSync(root + "/candidate.json", "utf8"));
          assert.equal(candidate.numFailedTests, 0);
          assert.equal(candidate.numPassedTests, 25);
          const files = ["scripts/lib/d1-migration-ledger.ts", "tests/d1-admin.test.ts", "tests/d1-migration-ledger.test.ts", "tests/d1-schema-snapshot.test.ts", "docs/d1-maintenance.md"];
          const blobs = files.map((path) => {
            const content = readFileSync(path);
            return { path, sha: createHash("sha1").update(Buffer.from("blob " + content.length + "\0")).update(content).digest("hex") };
          });
          const receipt = { source: process.env.GITHUB_SHA, run_id: process.env.GITHUB_RUN_ID, baseline: { failed: 4, passed: 21 }, candidate: { failed: 0, passed: 25 }, blobs };
          writeFileSync(root + "/receipt.json", JSON.stringify(receipt, null, 2) + "\n");
          console.log("QUALIFICATION_RECEIPT=" + JSON.stringify(receipt));
          NODE
      - name: Upload bounded source receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d1-annotation-source-qualification
          path: |
            test-results/d1-annotation/receipt.json
            scripts/lib/d1-migration-ledger.ts
            tests/d1-admin.test.ts
            tests/d1-migration-ledger.test.ts
            tests/d1-schema-snapshot.test.ts
            docs/d1-maintenance.md
          retention-days: 1
          if-no-files-found: error
