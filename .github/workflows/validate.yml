name: Validate

on:
  push:
    branches: [ci/graphql-core-qualification-20261018]

permissions:
  contents: read

jobs:
  graphql-core-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact qualification source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
      - name: Initialize public evidence receipt
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          import { spawnSync } from "node:child_process";
          if (process.env.GITHUB_REPOSITORY !== "JSONbored/metagraphed") throw new Error("Unexpected repository");
          const output = join(process.env.RUNNER_TEMP, "graphql-core-proof");
          mkdirSync(output, { recursive: true });
          const npm = spawnSync("npm", ["--version"], { encoding: "utf8" });
          if (npm.error || npm.status !== 0) throw new Error("npm version failed");
          const metadata = { repository: process.env.GITHUB_REPOSITORY, source: process.env.GITHUB_SHA, baseline: "189d90f2d10e6a745b6e50215ccf050980b17321", node: process.version, npm: npm.stdout.trim() };
          if (metadata.node !== "v22.23.2" || metadata.npm !== "10.9.8") throw new Error("Unexpected tool versions");
          writeFileSync(join(output, "metadata.json"), JSON.stringify(metadata, null, 2) + "\n");
          console.log("QUALIFICATION_METADATA " + JSON.stringify(metadata));
          NODE
      - name: Generate and pin the actual baseline CLI output
        run: |
          set -euo pipefail
          baseline_dir="$RUNNER_TEMP/graphql-core-baseline"
          proof_dir="$RUNNER_TEMP/graphql-core-proof"
          if ! git cat-file -e 189d90f2d10e6a745b6e50215ccf050980b17321^{commit}; then
            git -c http.extraheader= fetch --no-tags --depth=1 https://github.com/JSONbored/metagraphed.git 189d90f2d10e6a745b6e50215ccf050980b17321
          fi
          git cat-file -e 189d90f2d10e6a745b6e50215ccf050980b17321^{commit}
          git worktree add --detach "$baseline_dir" 189d90f2d10e6a745b6e50215ccf050980b17321
          (
            cd "$baseline_dir"
            npm ci --ignore-scripts --no-audit
            npm run validate:graphql-types-drift
            npm run build:graphql-types
            git diff --exit-code -- generated/graphql/schema.ts generated/graphql/types.ts
          )
          mkdir -p "$proof_dir/reference"
          cp "$baseline_dir/generated/graphql/schema.ts" "$proof_dir/reference/schema.ts"
          cp "$baseline_dir/generated/graphql/types.ts" "$proof_dir/reference/types.ts"
          node --input-type=module - "$baseline_dir" "$proof_dir" <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          import { createHash } from "node:crypto";
          import { join } from "node:path";
          const [baseline, output] = process.argv.slice(2);
          const files = ["generated/graphql/schema.ts", "generated/graphql/types.ts"];
          const hashes = Object.fromEntries(files.map(file => [file, createHash("sha256").update(readFileSync(join(baseline, file))).digest("hex")]));
          writeFileSync(join(output, "baseline-output-hashes.json"), JSON.stringify(hashes, null, 2) + "\n");
          console.log("BASELINE_CLI_OUTPUT " + JSON.stringify(hashes));
          NODE
      - name: Resolve only the intended Core API dependency declarations
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          if (pkg.devDependencies["@graphql-codegen/cli"] !== "^7.4.6") throw new Error("Unexpected CLI baseline");
          if (pkg.devDependencies["@graphql-codegen/core"] || pkg.devDependencies["@graphql-codegen/plugin-helpers"] || pkg.devDependencies["@graphql-tools/graphql-tag-pluck"]) throw new Error("Unexpected existing direct Core declarations");
          pkg.devDependencies = Object.fromEntries(Object.entries(pkg.devDependencies).flatMap(([name, version]) => {
            if (name === "@graphql-codegen/cli") return [["@graphql-codegen/core", "^6.2.2"]];
            if (name === "@graphql-codegen/typescript-resolvers") return [[name, version], ["@graphql-tools/graphql-tag-pluck", "^8.3.41"]];
            return [[name, version]];
          }));
          writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit
          npm ci --ignore-scripts --no-audit
      - name: Format only the candidate source and native package files
        run: |
          set -euo pipefail
          npm exec -- prettier --write codegen.ts scripts/generate-graphql-types.ts scripts/validate-graphql-types-drift.ts tests/shell-quote-consumers.test.ts tests/graphql-codegen-pipeline.test.ts package.json package-lock.json
          git diff --check
      - name: Assert actual Core versions and complete CLI graph removal
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          import { spawnSync } from "node:child_process";
          const output = join(process.env.RUNNER_TEMP, "graphql-core-proof");
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          const expected = { "@graphql-codegen/core": "6.2.2", "@graphql-codegen/plugin-helpers": "7.4.2", "@graphql-codegen/typescript": "6.1.2", "@graphql-codegen/typescript-resolvers": "6.1.1", "@graphql-tools/graphql-tag-pluck": "8.3.41" };
          const resolved = {};
          for (const [name, version] of Object.entries(expected)) {
            const record = lock.packages["node_modules/" + name];
            const installed = JSON.parse(readFileSync(join("node_modules", name, "package.json"), "utf8"));
            if (record?.version !== version || installed.version !== version) throw new Error("Unexpected installed dependency: " + name);
            resolved[name] = { locked: record.version, installed: installed.version };
          }
          for (const name of ["@graphql-codegen/core", "@graphql-tools/graphql-tag-pluck"]) {
            if (pkg.devDependencies[name] !== lock.packages[""].devDependencies[name]) throw new Error("Manifest/lock declaration mismatch: " + name);
          }
          const removed = ["@graphql-codegen/cli", "braces", "micromatch"];
          for (const name of removed) {
            if (pkg.dependencies?.[name] || pkg.devDependencies?.[name] || Object.keys(lock.packages).some(file => file.endsWith("node_modules/" + name))) throw new Error("Unremoved dependency: " + name);
          }
          const listing = spawnSync("npm", ["ls", ...removed, "--all", "--json"], { encoding: "utf8", maxBuffer: 16 * 1024 * 1024 });
          writeFileSync(join(output, "removed-dependency-list.json"), listing.stdout);
          writeFileSync(join(output, "removed-dependency-list.stderr.txt"), listing.stderr);
          if (listing.error || ![0, 1].includes(listing.status)) throw new Error("Dependency listing failed");
          const graph = JSON.parse(listing.stdout);
          if (graph.error || graph.problems?.length || Object.keys(graph.dependencies || {}).length) throw new Error("Removed packages still appear in the installed graph");
          writeFileSync(join(output, "resolved-versions.json"), JSON.stringify(resolved, null, 2) + "\n");
          console.log("RESOLVED_CORE_VERSIONS " + JSON.stringify(resolved));
          console.log("REMOVED_DEPENDENCY_LIST " + JSON.stringify({ exit_code: listing.status, graph }));
          NODE
      - name: Require complete zero-finding audit evidence
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { spawnSync } from "node:child_process";
          import { writeFileSync } from "node:fs";
          import { join } from "node:path";
          const output = join(process.env.RUNNER_TEMP, "graphql-core-proof");
          const scopes = [["all", ["--workspaces", "--include-workspace-root"]], ["root-runtime", ["--omit=dev", "--workspaces=false"]], ["ui-runtime", ["--omit=dev", "--workspace=apps/ui"]]];
          for (const [name, args] of scopes) {
            const result = spawnSync("npm", ["audit", "--json", ...args], { encoding: "utf8", maxBuffer: 16 * 1024 * 1024 });
            writeFileSync(join(output, name + ".json"), result.stdout);
            writeFileSync(join(output, name + ".stderr.txt"), result.stderr);
            const report = JSON.parse(result.stdout);
            if (result.error || result.status !== 0 || report.error || !report.metadata || !report.vulnerabilities || report.metadata.vulnerabilities?.total !== 0) throw new Error("Incomplete or nonzero audit: " + name);
            console.log("AUDIT_" + name + " " + JSON.stringify({ exit_code: result.status, ...report }));
          }
          NODE
      - name: Require exact canonical equality with baseline CLI
        run: |
          set -euo pipefail
          npm run validate:graphql-types-drift
          npm run build:graphql-types
          git diff --exit-code -- generated/graphql/schema.ts generated/graphql/types.ts
          cmp generated/graphql/schema.ts "$RUNNER_TEMP/graphql-core-proof/reference/schema.ts"
          cmp generated/graphql/types.ts "$RUNNER_TEMP/graphql-core-proof/reference/types.ts"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          import { createHash } from "node:crypto";
          import { join } from "node:path";
          const output = join(process.env.RUNNER_TEMP, "graphql-core-proof");
          const expected = JSON.parse(readFileSync(join(output, "baseline-output-hashes.json"), "utf8"));
          const actual = Object.fromEntries(Object.keys(expected).map(file => [file, createHash("sha256").update(readFileSync(file)).digest("hex")]));
          if (Object.keys(expected).some(file => actual[file] !== expected[file])) throw new Error("Core output differs from baseline CLI");
          writeFileSync(join(output, "candidate-output-hashes.json"), JSON.stringify(actual, null, 2) + "\n");
          console.log("EXACT_CANONICAL_IDENTITY " + JSON.stringify(actual));
          NODE
      - name: Qualify fixed pipeline and GraphQL contracts
        run: |
          set -euo pipefail
          npm exec -- vitest run tests/graphql-codegen-pipeline.test.ts tests/shell-quote-consumers.test.ts tests/graphql-generated-schema.test.ts tests/graphql-component-parity.test.ts tests/graphql-query-arguments.test.ts
          npm run typecheck -- --incremental false
          npm run validate:unreferenced-modules
          npm run validate:unreferenced-exports
          npm run scan:public-safety
          npm run validate:private-boundary
      - name: Retain only allowlisted public review files
        if: always()
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/graphql-core-proof"
          mkdir -p "$proof_dir/source/scripts" "$proof_dir/source/tests"
          cp package.json package-lock.json codegen.ts "$proof_dir/source/"
          cp scripts/generate-graphql-types.ts scripts/validate-graphql-types-drift.ts "$proof_dir/source/scripts/"
          cp tests/shell-quote-consumers.test.ts tests/graphql-codegen-pipeline.test.ts "$proof_dir/source/tests/"
          git diff -- package.json package-lock.json codegen.ts scripts/generate-graphql-types.ts scripts/validate-graphql-types-drift.ts tests/shell-quote-consumers.test.ts tests/graphql-codegen-pipeline.test.ts > "$proof_dir/native-source-adjustments.patch"
          git diff 189d90f2d10e6a745b6e50215ccf050980b17321 -- package.json package-lock.json codegen.ts scripts/generate-graphql-types.ts scripts/validate-graphql-types-drift.ts tests/shell-quote-consumers.test.ts tests/graphql-codegen-pipeline.test.ts > "$proof_dir/full-candidate.patch"
      - name: Upload public qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: graphql-core-qualification
          path: ${{ runner.temp }}/graphql-core-proof/
          retention-days: 7
          if-no-files-found: error
