name: Validate

on:
  pull_request:
    # Explicit list because the default (opened/synchronize/reopened) omits ready_for_review -- the
    # heavy jobs below skip draft PRs, so marking a PR ready must itself trigger a real run, not wait
    # for the next push. Mirrors ui-preview.yml's own types list.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel-in-progress is right for a PR and wrong for main, so it is keyed off
  # the event rather than set flat. On a PR, a new push makes the older run
  # meaningless -- only the head commit is being merged. On MAIN, the run IS the
  # post-merge verification, and cancelling it drops the only check that the
  # merged tree is sound (same reasoning sync-contract-artifacts.yml gives for
  # its own `false`, and every other push-to-main workflow here already agrees).
  #
  # This was not a theoretical gap. On 2026-08-03 merges landed every few
  # minutes against a ~7-minute `test` job, so EVERY main run from 07:54 onward
  # was cancelled by the next merge and not one completed. Main's status went
  # blind in both directions: a genuinely failing tree (the projection-lanes
  # count, #9200) sat unreported, and the merge that fixed it could not report
  # green either. GitHub still supersedes a queued run when a newer one arrives,
  # so this does not build an unbounded backlog -- it only stops killing a run
  # that is already doing the work.
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every contributor PR runs the FULL validation — there is NO reduced "UGC"
# fast-lane. The old lane skipped the safety scans for "single community file"
# PRs and kept causing a stale-base preflight false-positive; community surfaces
# now live in one file per subnet (registry/subnets/<slug>.json) and are checked
# by the same gates as everything else (validate:surface + public-safety +
# private-boundary, all below).
#
# The DOCS FAST-LANE below is a narrower, separate thing: it does not skip any
# job or reduce the safety/security gates, including validate:private-boundary,
# for anything that could plausibly need them. It only lets a diff that is
# PURELY prose (**/*.md + .claude/skills/**) — which cannot touch registry data,
# schemas, code, or CI config — skip build/contract/registry/deploy work, while
# still reporting a real `success` conclusion (not `skipped`) on every step.
#
# The suite and the ~20 contract/schema/safety validations run in ONE `test` job (merged
# 2026-07-24; they were two parallel jobs that each ran their own npm ci + full build). The old
# split bought wall-clock (max instead of sum) at the cost of a second 30-minute-class runner on
# EVERY PR -- and at this account's PR volume the shared 20-concurrent-job pool, not wall-clock,
# is the binding constraint (observed: a 40+-deep starved queue across repos). One job pays one
# npm ci + one build for both halves. Step order is load-bearing: the contract drift validators
# MUST precede the build (they compare committed files the build overwrites), the derived-artifact
# freshness check MUST follow the build and precede the suite (the suite's artifact writers mutate
# staging trees), and the suite runs last so coverage capture is unaffected.
jobs:
  # Computes the docs-fast-lane eligibility for the `checks` job below. This is
  # a plain shell `git diff` inline in the trusted workflow — no third-party
  # action. (dorny/paths-filter was considered and rejected: it is published by
  # an individual GitHub user, not a GitHub-verified-creator org, and this
  # repo's Actions allowlist is `{github_owned_allowed, verified_allowed,
  # patterns_allowed: ["peter-evans/create-pull-request@*"]}` — an unlisted,
  # unverified third-party action would hit a startup_failure. Reusing the
  # existing "Compute submitted files" pattern already in `checks` avoids the
  # dependency and the allowlist question entirely.)
  #
  # `docs_only` is true only when EVERY changed path matches `**/*.md` or
  # `.claude/skills/**` (this skill directory is contributor-facing playbook
  # docs, not workflow/schema/script config). `registry_touched` is a HARD
  # GUARDRAIL, computed independently: if the diff touches anything under
  # `registry/` it force-overrides `docs_only` back to false, no matter what
  # else the diff contains. This directly encodes the incident already
  # documented above validate.yml's job comment — the old reduced "ugc" lane
  # was scoped to registry/community-surface PRs and caused a stale-base
  # preflight false-positive, so registry-touching diffs get zero special
  # treatment here, full stop.
  #
  # On push-to-main and workflow_dispatch (no base to diff against) this
  # always resolves docs_only=false — the fast lane only ever applies to a
  # `pull_request` event, where a real merge-base diff exists.
  #
  # Two further outputs, independent of docs_only and of each other: `Validate
  # workflows` (scripts/validate-workflows.ts) reads ONLY
  # `.github/workflows/*.yml`/`.yaml`, and `Validate migration sequence`
  # (scripts/validate-migrations.ts) reads ONLY `migrations/*.sql` — verified
  # by reading each script's full source; neither imports anything outside its
  # own directory. Each flag also matches its OWN validator script path
  # (scripts/validate-workflows.ts / scripts/validate-migrations.ts) directly,
  # so editing the validator's logic itself still runs it even when the diff
  # doesn't touch `.github/workflows/` or `migrations/`. A PR can be
  # workflow-only or migration-only without being a docs PR, so these are
  # computed as their own flags rather than folded into docs_only, and neither
  # needs the registry guardrail above (neither path is registry-adjacent).
  # Every other `checks` validator was evaluated for the same treatment and
  # rejected: the contract/schema/route validators
  # (validate:schemas/api/mcp/ai/openapi/types) all transitively import most of
  # `src/` + `workers/**` via `workers/api.ts`, so no path glob short of
  # "almost the whole repo" would safely exclude them — see
  # `.claude/skills/metagraphed/reference.md`'s "new artifact/route checklist"
  # for why a route/handler change can trip a contract gate with no lexical
  # hint in the diff.
  #
  # A third, same-shape flag: `run_ui_validation` gates the `ui` job below
  # (apps/ui, the TanStack Start/Vite frontend folded in as an npm workspace —
  # #3062). Matches `^apps/ui/` OR `^packages/client/` OR `^packages/contract/`
  # -- the latter two are required, not optional: packages/client/dist/
  # index.js + index.cjs are committed (#3066/#3294), and the ui job's "Build
  # packages/client (drift check)" step is the ONLY place that verifies those
  # committed files still match a fresh build from src. A packages/client-only
  # PR (no apps/ui touch) would otherwise skip that check entirely, letting
  # stale or directly-tampered committed runtime code merge unverified (a real
  # P1 finding from Superagent on #3294 — this was fixed in response to that,
  # not written correctly the first time). packages/contract/** (#3067, the
  # shared OpenAPI-derived contract types packages/client bundles) needs the
  # same trigger for the same reason: a schema-only PR can regenerate
  # packages/contract/index.d.ts (caught fresh by `checks`' own
  # validate:contract-drift) without anyone rebuilding+committing
  # packages/client/dist to match, and that drift would only ever be caught
  # here. None of these three directories' validation touches anything outside
  # themselves, so this flag isn't registry-adjacent either, same reasoning as
  # the two flags above.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10 # single inline git diff against the base ref, no build
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
      run_workflows_validation: ${{ steps.filter.outputs.run_workflows_validation }}
      run_migrations_validation: ${{ steps.filter.outputs.run_migrations_validation }}
      run_ui_validation: ${{ steps.filter.outputs.run_ui_validation }}
      run_ui_e2e: ${{ steps.filter.outputs.run_ui_e2e }}
      run_python_validation: ${{ steps.filter.outputs.run_python_validation }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Compute fast-lane eligibility
        id: filter
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            {
              echo "docs_only=false"
              echo "run_workflows_validation=true"
              echo "run_migrations_validation=true"
              echo "run_ui_validation=true"
              echo "run_ui_e2e=true"
              echo "run_python_validation=true"
            } >> "$GITHUB_OUTPUT"
            echo "Not a pull_request event (${{ github.event_name }}) -- full validation runs."
            exit 0
          fi

          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            range="$BASE_SHA...$HEAD_SHA"
          else
            git fetch origin "$BASE_REF"
            range="origin/$BASE_REF...HEAD"
          fi
          git diff --name-only "$range" > changed-files.txt

          if [ ! -s changed-files.txt ]; then
            {
              echo "docs_only=false"
              echo "run_workflows_validation=true"
              echo "run_migrations_validation=true"
              echo "run_ui_validation=true"
              echo "run_ui_e2e=true"
              echo "run_python_validation=true"
            } >> "$GITHUB_OUTPUT"
            echo "No changed files detected -- full validation runs."
            exit 0
          fi

          echo "Changed files:"
          cat changed-files.txt

          # Narrow, independent skips -- see the job comment above for the
          # file:line evidence that these two validators' entire footprint is
          # their own directory.
          if grep -qE '^\.github/workflows/|^scripts/validate-workflows\.ts$' changed-files.txt; then
            echo "run_workflows_validation=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_workflows_validation=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^migrations/|^scripts/validate-migrations\.ts$' changed-files.txt; then
            echo "run_migrations_validation=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_migrations_validation=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^apps/ui/|^packages/chain-summaries/|^packages/client/|^packages/contract/|^packages/ui-kit/' changed-files.txt; then
            echo "run_ui_validation=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_ui_validation=false" >> "$GITHUB_OUTPUT"
          fi
          # The Playwright overflow check renders pages in a browser, so only a
          # change that can alter RENDERED OUTPUT can alter its result (#8929).
          # packages/contract is types-only -- its whole published surface is
          # index.d.ts ("files": ["index.d.ts"], no "main"), and TypeScript types
          # are erased at runtime -- so a contract-only diff cannot move a pixel.
          # It still needs the rest of the ui job (typecheck, the committed-dist
          # drift checks), just not 240s of browser work. Same for
          # chain-summaries/ui-kit-only diffs, which have their own suites here.
          # packages/client IS included: its committed dist is real runtime code
          # apps/ui executes, so it can change what renders.
          if grep -qE '^apps/ui/|^packages/client/' changed-files.txt; then
            echo "run_ui_e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_ui_e2e=false" >> "$GITHUB_OUTPUT"
          fi
          # Same-shape flag for the python job, which runs two independent hermetic suites: the
          # Python SDK's (reads only python/**) and the data-refresh scripts' (reads only
          # scripts/**.py). scripts/ is overwhelmingly TypeScript since #7510, so this gates on the
          # .py extension rather than the whole directory -- a .ts-only diff under scripts/ cannot
          # change either suite's result.
          if grep -qE '^python/|^scripts/.*\.py$' changed-files.txt; then
            echo "run_python_validation=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_python_validation=false" >> "$GITHUB_OUTPUT"
          fi

          # HARD GUARDRAIL: any registry/ path forces full validation,
          # unconditionally, regardless of every other path in the diff. See
          # the job comment above for why -- this is not a suggestion.
          if grep -qE '^registry/' changed-files.txt; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Diff touches registry/ -- forcing full validation (no exceptions)."
            exit 0
          fi

          # docs_only requires EVERY changed path to match one of the two safe
          # patterns below. A single non-matching path anywhere disqualifies
          # the whole PR from the fast lane. Both patterns require a `.md`
          # suffix -- a hypothetical future non-.md file under
          # .claude/skills/** (e.g. a template or config) must NOT qualify,
          # since only prose content is proven safe to skip validation for.
          if grep -vE '(^|/)[^/]+\.md$|^\.claude/skills/.*\.md$' changed-files.txt > /dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Diff includes non-docs paths -- full validation runs."
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Diff is 100% **/*.md + .claude/skills/** -- docs fast lane applies to the checks job."
          fi

  validate:
    name: validate
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 45 # one npm ci + one build now serves BOTH the suite and the ~20 validators (see the merge note above jobs:)
    # Skip draft PRs (anti-abuse, mirrors ui-preview.yml): a draft consumed the full heavy fan-out on
    # every push before anyone marked it ready. Job-level skip is safe here: this repo has ZERO
    # required status contexts on main (verified via branches/main/protection), and the review
    # pipeline's fetchLiveCiAggregate buckets skipped identically to success.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    env:
      # The docs fast lane + narrow validator skips, unchanged from the old `checks` job -- see the
      # `changes` job comment above for what each flag proves. Still per-STEP guards (not job-level):
      # the suite half of this job must run even on a docs-only diff.
      DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
      RUN_WORKFLOWS_VALIDATION: ${{ needs.changes.outputs.run_workflows_validation }}
      RUN_MIGRATIONS_VALIDATION: ${{ needs.changes.outputs.run_migrations_validation }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Pin to the contributor's actual pushed commit, not GitHub's default
          # refs/pull/:N/merge preview -- keeps CI deterministic for a given sha
          # (a PR can't start failing just because main moved) and matches what
          # Codecov's patch status is measuring. See the coverage upload steps
          # below for why this specifically also fixes commit attribution.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      # Compute the deletion-filtered list of files this PR submits, inline in the
      # trusted workflow (PR contents are untrusted). It feeds ONLY the
      # reproducible-artifact verifier below, which diff-scopes its check to the
      # files actually changed. There is no reduced lane to forge — every PR runs
      # the full validation regardless of this list.
      - name: Compute submitted files
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
              git diff --name-only --diff-filter=d "$BASE_SHA"..."$HEAD_SHA" > submitted-artifact-files.txt
            else
              git fetch origin "$BASE_REF"
              git diff --name-only --diff-filter=d "origin/$BASE_REF"...HEAD > submitted-artifact-files.txt
            fi
          else
            : > submitted-artifact-files.txt
          fi

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.2
          cache: npm
          # Without this, setup-node's cache key hashes EVERY package-lock.json
          # in the tree, so a lockfile anywhere else would invalidate this job's
          # cache even though `npm ci` here only ever reads the root one.
          # packages/client is an npm
          # workspace (#3066) with no lockfile of its own anymore — its version
          # bumps land in the root lockfile, which this path already covers.
          cache-dependency-path: package-lock.json

      - name: Install
        # Behind the lockfile-keyed node_modules cache: a hit skips npm ci and
        # every postinstall's network reach with it (#10871) -- see the
        # composite's header for why setup-node's tarball cache cannot do this.
        uses: ./.github/actions/install-deps

      # Report-only SCA for the ROOT workspace — workers/** (the Worker API, MCP
      # server, webhook dispatcher), src/**, and scripts/** — the repo's larger,
      # more security-sensitive dependency surface, which until now had strictly
      # less CI coverage than apps/ui (#5543). Same posture as the apps/ui CVE
      # scan in the `ui` job below and the gate #1772 established: surface
      # high/critical runtime advisories at PR time without failing the job
      # (Renovate is async/non-blocking, so a feature PR can still merge a
      # vulnerable transitive dep between Renovate runs). No `--workspace` flag,
      # so this audits the whole lockfile — a superset that necessarily covers
      # the root deps this gap is about; the minor overlap with the apps/ui-
      # scoped scan is harmless since both are report-only. Never `--force`.
      # Tighten to blocking once it stays clean.
      - name: Dependency CVE scan (SCA, report-only)
        run: |
          npm audit --audit-level=high --omit=dev \
            || echo "::warning::npm audit found high/critical advisories in the root workspace's runtime dependencies — review above (report-only; not failing CI yet)"

      # Lint + format + the documentation/intake/safety/security scans below
      # run UNCONDITIONALLY, docs fast lane or not — they're cheap (no build,
      # no network), and directly relevant to a docs-only diff (a stray secret,
      # private-boundary leak, broken doc-contract reference, or malformed
      # intake template can land in a "docs-only" PR just as easily as in a
      # code PR).
      # CONCURRENTLY, not sequentially (#10424). eslint and prettier read the
      # same tree and write nothing, so they share nothing but CPU: timed
      # separately they are 38s and 29s, and in series that is the 80s that
      # dominated this job.
      #
      # Both are waited on and the exit code is carried out explicitly, because
      # a bare `cmd & cmd & wait` reports the SHELL's status, not the jobs' --
      # it would turn a red lint into a green step, which is worse than a slow
      # one. Verified against every combination: (0,0)->0, (1,0)->1, (0,1)->1,
      # (3,5)->5. Both still run even when the first fails, so one push shows
      # you both lists rather than making you fix them one at a time.
      # Both tools skip a file whose CONTENT hash is unchanged (#10608).
      # Measured on this tree: eslint 28.1s -> 2.6s warm, prettier 51.5s -> 2.7s
      # warm, and the step is bounded by prettier because the two run
      # concurrently. A cold or stale cache costs a full run, never a wrong
      # pass -- both index by file hash, so a changed file is always re-read
      # (verified: an unformatted file still exits 1 with the cache warm).
      #
      # Keyed on the lockfile AND both configs, because a rule change has to
      # invalidate every file's entry; `restore-keys` falls back to the newest
      # prior entry, and the run sha makes every run save a fresh one -- the
      # same shape as the tsbuildinfo cache below.
      - name: Cache lint + format indexes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .eslintcache
            .prettiercache
          key: ${{ runner.os }}-lintcache-${{ hashFiles('package-lock.json', 'eslint.config.ts', '.prettierignore') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-lintcache-${{ hashFiles('package-lock.json', 'eslint.config.ts', '.prettierignore') }}-

      - name: Lint + format
        run: |
          npm run lint & lint=$!
          npm run format:check & fmt=$!
          rc=0
          wait $lint || rc=$?
          wait $fmt || rc=$?
          exit $rc

      # Same class of check as Lint + format above: cheap, no build, no network
      # — runs unconditionally rather than gating on DOCS_ONLY since a real
      # docs-only diff can't touch a .ts file anyway (see typescript-migration
      # epic metagraphed#7510). tsc reads tsconfig.json's own include/exclude,
      # not the file list — this typechecks the whole in-scope tree every run,
      # not just files this PR touched.
      # Incremental typecheck (#8924): tsc reuses a .tsbuildinfo and revalidates
      # only what changed -- measured 8.5s -> 1.8s warm. Keyed on the lockfile
      # (a dependency change invalidates types) plus the run sha so every run
      # saves a fresh entry; restore-keys falls back to the newest prior one.
      # A cold or stale buildinfo costs a full check, never a wrong one: tsc
      # verifies every input against the version recorded in it.
      - name: Cache TypeScript buildinfo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tsconfig.tsbuildinfo
          key: ${{ runner.os }}-tsbuildinfo-root-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-tsbuildinfo-root-${{ hashFiles('package-lock.json') }}-

      - name: Typecheck
        run: npm run typecheck

      # Drift gate: these compare the COMMITTED contract (openapi.json, the schema
      # bundle, generated types + client) against what the schemas regenerate, so
      # they MUST run before the build step below overwrites those committed files.
      # This is the gate CONTRIBUTING.md references — without it a stale or
      # hand-edited committed contract could land on main undetected.
      #
      # Skipped for a proven docs-only diff: **/*.md + .claude/skills/** cannot
      # touch schemas/, openapi.json, or any generated contract file, so there
      # is nothing for this to drift-check.
      # Every validator below runs even when an earlier one fails, and the step
      # fails at the end naming all of them (#10608).
      #
      # `bash -e` stopped at the FIRST failure, so one red validator hid every
      # validator after it and each fix cost another ~5-minute round trip to
      # discover the next one. Measured over one evening: #10577 reached this
      # step, failed on validate:worker-types-parity, and skipped 39 of the
      # job's 52 steps; #10572 skipped 20; #10563 skipped 14. Three PRs, three
      # extra round trips, none of which learned anything a single run could
      # not have said.
      #
      # `run_step` takes the command verbatim so every line below still spells
      # the npm invocation in full. That is load-bearing:
      # tests/pipeline-validator-parity.test.ts greps this file for those
      # invocations to prove no declared validator has quietly stopped running
      # in CI (#10251). Passing a list of bare script names to a runner script
      # would blind that gate for every validator at once.
      - name: Validate committed contract (drift)
        if: env.DOCS_ONLY != 'true'
        shell: bash
        run: |
          source .github/scripts/run-step.sh
          run_step npm run validate:contract-drift
          run_step npm run validate:db-types-drift
          run_step npm run validate:lakehouse-types-drift
          run_step npm run validate:lakehouse-readers
          run_step npm run validate:store-type-parity
          run_step npm run validate:featured-validators-drift
          run_step npm run validate:schema-enums
          run_step npm run validate:openapi-examples
          run_step npm run validate:generated-client
          run_step npm run validate:graphql-types-drift
          run_step npm run validate:worker-types-parity
          run_step npm run validate:graphql-route-parity
          run_step npm run validate:graphql-hand-written-checks
          run_step npm run validate:graphql-component-parity
          run_step npm run validate:graphql-query-arguments
          run_step npm run validate:published-names
          run_step npm run validate:graphql-tier-parity
          run_step npm run validate:committed-seed
          # Both of these were reachable only from the LOCAL gate, so a
          # contract-only PR -- the exact PR that invalidates them -- got no CI
          # coverage at all (#10251). They live in this step rather than the
          # `ui` job because that job is gated on a path filter that matches
          # neither schemas-src/ nor public/metagraph/openapi.json.
          run_step npm run validate:ui-docs-drift
          # #10300: published routes the UI renders nowhere. A RATCHET -- the
          # count may only fall, so a new route either gets rendered or fails
          # here rather than drifting up one PR at a time, which is how the
          # gap went 30 -> 35 with nothing watching.
          run_step npm run validate:ui-route-coverage
          run_step npm run validate:untyped-db-reads
          run_step npm run validate:untyped-lakehouse-reads
          run_step npm run validate:readme-catalog
          report_steps

      # Stage artifacts for BOTH halves: the suite's reader tests serve R2-only artifacts with NO
      # committed fallback (dist/metagraph-r2/metagraph/*), and every post-build validator below reads
      # the fresh tree. Unconditional (no DOCS_ONLY skip): the suite runs on the docs fast lane too --
      # coverage is a repo-wide delta gate, exactly as the pre-merge `test` job always built. MUST run
      # AFTER the contract drift validators above (they compare the committed files this overwrites).
      - name: Build artifacts
        env:
          METAGRAPH_PRESERVE_PROBE_HEALTH: "1"
        run: npm run build

      - name: Verify submitted public artifacts are reproducible
        if: env.DOCS_ONLY != 'true' && github.event_name == 'pull_request'
        run: node scripts/ci-verify-submitted-artifacts.ts --changed-files submitted-artifact-files.txt

      - name: Validate registry
        if: env.DOCS_ONLY != 'true'
        run: npm run validate

      - name: Generate R2 manifest
        if: env.DOCS_ONLY != 'true'
        run: npm run r2:manifest

      # #1025: committed derived artifacts under public/ must match a fresh
      # build. The validators above run AFTER `npm run build`, so they only ever
      # see freshly-rebuilt files — never the committed-stale ones — and
      # ci-verify is diff-scoped, so a source-only PR never re-checks untouched
      # derived files. This gate closes that silent-drift hole: a full rebuild
      # has just run (build + r2:manifest), so any working-tree change here means
      # a committed artifact was left stale. The deterministic derived artifacts
      # use a fixed reproducible `generated_at` placeholder; the R2-only dist/
      # tree is gitignored and excluded automatically.
      #
      # r2-manifest.json is excluded: its `*_artifact_size_bytes` totals sum the
      # R2-only artifacts, whose byte sizes vary slightly build-to-build, so it
      # is inherently non-deterministic. It is publish infrastructure regenerated
      # on every publish (and by the r2:manifest step above), so its committed
      # copy is a best-effort lockfile, not a served/contract surface.
      #
      # Skipped on the docs fast lane along with the "Build artifacts" step it
      # depends on above -- there is no fresh build to diff against.
      - name: Verify committed derived artifacts are fresh
        if: env.DOCS_ONLY != 'true'
        run: |
          # Only CONTRACT artifacts are gated here — openapi.json / types.d.ts /
          # contracts.json / api-index.json — because they change only with reviewed
          # schema/source PRs and MUST be regenerated + committed. DATA/CONTENT-derived
          # artifacts are NOT gated: they re-drift on every registry/data edit and would
          # red-line build-less community surface PRs (the single-file model makes adding
          # a surface a one-file data PR). Those are handled out-of-band: public/datasets/
          # + the llms.txt catalogs are gitignored (rebuilt + served via ASSETS on
          # deploy); r2-manifest.json is the publish lockfile; schemas/index.json is a
          # network-capture cache the build reconciles in place (a new openapi surface
          # legitimately adds a not-captured placeholder); and operational-surfaces.json
          # is CONTENT-derived — the prober's input list regenerates whenever a
          # probe-enabled, public-safe operational-kind surface (subnet-api / sse /
          # data-artifact / wss / rpc) is added or changed, which a one-file community
          # surface PR does NOT regenerate (there is no authority/review gate on that
          # list).
          #
          # #9096 changed WHO KEEPS THOSE TWO FRESH, not whether they are gated here.
          # Both were previously refreshed by hourly/daily bot-PR workflows
          # (sync-operational-surfaces, sync-schema-snapshots), both now retired: the
          # live copies are written directly by Worker crons into R2 stores
          # (generated/operational-surfaces.json, generated/schemas-index.json) that
          # every reader prefers. The committed files stayed behind as FALLBACK SEEDS —
          # operational-surfaces.json so the prober's ASSETS read succeeds on a cold
          # start, schemas/index.json so a credential-less build still has a drift
          # baseline — so a momentarily-stale git copy is a tolerated seed, not a
          # runtime fault, and gating a contributor's build on either would red-line
          # PRs over data no contributor produced.
          excludes=(
            ':(exclude)public/metagraph/r2-manifest.json'
            ':(exclude)public/metagraph/schemas/index.json'
            ':(exclude)public/metagraph/operational-surfaces.json'
            ':(exclude)public/datasets'
          )
          status=$(git status --porcelain --untracked-files=all -- public/ "${excludes[@]}")
          if [ -n "$status" ]; then
            echo "::error::Committed derived artifacts under public/ are stale (a fresh build changed, deleted, or recreated them). Run 'npm run build' and commit the result."
            printf '%s\n' "$status"
            git diff --name-only -- public/ "${excludes[@]}"
            git diff --stat -- public/ "${excludes[@]}"
            exit 1
          fi
          echo "All committed derived artifacts under public/ match a fresh build."

      # The contract surface: schemas, the Worker API, the MCP mirror of it, the
      # query vocabulary, and the generated types. Every one reads the built
      # tree and none of them writes, so they are independent and all of them
      # run even when an earlier one fails -- see the drift step above for what
      # stopping at the first cost. One step rather than eleven also drops
      # eleven Actions step boundaries.
      - name: Validate the API contract surface
        if: env.DOCS_ONLY != 'true'
        shell: bash
        run: |
          source .github/scripts/run-step.sh
          run_step npm run validate:schemas
          run_step npm run validate:api
          run_step npm run validate:mcp
          run_step npm run validate:startup-budget
          run_step npm run validate:mcp-route-map
          run_step npm run validate:operations
          run_step npm run validate:type-duplicates
          run_step npm run validate:nullable-overpromises
          run_step npm run validate:no-passthrough
          run_step npm run validate:schema-shape-duplicates
          run_step npm run validate:mcp-input-parity
          run_step npm run validate:tool-route-divergence
          run_step npm run validate:query-vocabulary
          run_step npm run validate:route-query-parity
          run_step npm run validate:ai
          run_step npm run validate:openapi
          run_step npm run validate:types
          report_steps

      # Client-SDK drift gate: a contract-only PR (schemas → generated →
      # openapi.json) is NOT under packages/client/**, so release-please never
      # bumps the `client` component and the published @jsonbored/metagraphed
      # silently lags the live contract. This fails the PR when a contract file
      # changed versus the merge base but packages/client/package.json "version"
      # was not bumped. Diff-scoped: non-contract PRs never fire.
      - name: Validate client-SDK sync (contract ↔ published version)
        if: env.DOCS_ONLY != 'true' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run validate:client-sdk-sync

      - name: Validate artifact size budgets
        if: env.DOCS_ONLY != 'true'
        run: npm run validate:artifact-budgets

      # Always runs, docs fast lane or not: cheap (reads README.md +
      # docs/backend-artifact-contracts.md + src/contracts.ts, no build, no
      # network) and this is exactly the gate a docs-only PR is most likely to
      # need — the repo's own docs-only.md PR template lists it first.
      - name: Validate documentation contracts
        run: npm run validate:docs

      # Companion to the step above: validate:docs checks that every artifact and
      # route is MENTIONED in docs/backend-artifact-contracts.md; this checks that
      # a bullet did not silently outlive the behavior it describes. Fires only
      # when a description's tier/liveness/provenance claims moved versus the
      # merge base and the bullet stayed byte-identical (#9545 shipped exactly
      # that). PR-only: it needs a merge base to diff against.
      - name: Validate contract ↔ doc sync
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run validate:contract-doc-sync

      # NOTE: the README subnet catalog is intentionally NOT gated here. It is a
      # DATA-derived listing (regenerated by `npm run readme:catalog` from
      # registry/subnets/), so gating it red-lined build-less community surface
      # PRs that legitimately change a subnet's catalog row. README freshness is
      # owned out-of-band by .github/workflows/readme-catalog-refresh.yml, which
      # accumulates drift into a single chore/readme-catalog PR on every
      # registry/subnets push. (Same rationale as the gitignored llms.txt
      # catalogs + public/datasets — DATA artifacts are not PR-gated.)

      # Always runs (see docs/backend-artifact-contracts.md rationale above):
      # cheap file-only scan of .github/ISSUE_TEMPLATE + the PR template, no
      # build required, and listed in docs-only.md's own checklist.
      - name: Validate intake templates
        run: npm run validate:intake

      - name: Validate registry subnet files
        if: env.DOCS_ONLY != 'true'
        run: npm run validate:surface

      # #10443/#10516: relationships the JSON Schema cannot see. A
      # `probe-derived` revenue figure on a surface nothing probes did not come
      # from a probe, and a revenue/treasury role on a PROTOCOL-DERIVED subnet
      # account is the misattribution #10448 nearly made — that account
      # receives large many-party inbound because that is what buying alpha
      # looks like, so evidence requirements pass it while the conclusion stays
      # wrong. File-only scan over registry/, no build needed.
      - name: Validate revenue provenance
        if: env.DOCS_ONLY != 'true'
        run: npm run validate:revenue-provenance

      # #8658: the cron prober's input list and call_subnet_surface's resolution
      # catalog must be exactly the published registry filtered to
      # probe-enabled + public-safe + callable kinds. When they drift, surfaces
      # advertised as probe-enabled are never probed AND agents get an error for
      # ids that demonstrably exist. Runs after `npm run build` above so the
      # staged surfaces.json exists to compare against; skips (rather than
      # fails) if it does not, so ordering can never turn into a false alarm.
      - name: Validate operational-surface parity
        if: env.DOCS_ONLY != 'true'
        run: npm run validate:operational-surface-parity

      # Narrow, independent skip (not tied to DOCS_ONLY): scripts/validate-workflows.ts
      # reads ONLY .github/workflows/*.yml/.yaml, so a PR with zero changes under
      # that path cannot affect this validator's result. See the `changes` job
      # comment for the full rationale.
      - name: Validate workflows
        if: env.RUN_WORKFLOWS_VALIDATION == 'true'
        run: npm run validate:workflows

      # Narrow, independent skip (not tied to DOCS_ONLY): scripts/validate-migrations.ts
      # reads ONLY migrations/*.sql, so a PR with zero changes under that path
      # cannot affect this validator's result. See the `changes` job comment for
      # the full rationale.
      - name: Validate migration sequence
        if: env.RUN_MIGRATIONS_VALIDATION == 'true'
        run: npm run validate:migrations

      # Permanent lock on the TS migration (#7510/#7521): no hand-written
      # .mjs/.js may reappear under src/, workers/, scripts/ or tests/.
      # Runs unconditionally (no DOCS_ONLY skip) — it reads
      # only `git ls-files` output, costs well under a second, and a skip
      # predicate would itself be a hole (a "docs-only" PR can still add a
      # tracked .mjs file).
      # The permanent source-tree locks. Every one reads only the committed
      # source and costs about a second, which is why they run on the docs fast
      # lane too -- a "docs-only" PR can still re-add a hand-written component
      # file. Grouped so one failure does not hide the other seven; each keeps
      # the reason it exists.
      #
      #   no-hand-written-mjs      the .ts migration lock (#7510)
      #   single-schema-source     every published OpenAPI component comes from
      #                            schemas-src/ and nowhere else (#9830)
      #   schema-opacity           an object published with no declared
      #                            properties carries a written reason (#9797)
      #   schema-vocabularies      a value set of three or more members lives in
      #                            ONE schema file unless declared debt (#9799)
      #   unreferenced-modules     files nothing imports (#10221)
      #   unreferenced-exports     the export half, a ratchet rather than
      #                            pass/fail -- most of the count is contract
      #                            names the registry links by string, which no
      #                            static tool can follow (#10292)
      #   module-state-resets      module-level mutable state in src/ and
      #                            workers/ registers a reset, or it leaks
      #                            across test files once the coverage pass runs
      #                            with `isolate: false` (#8922)
      #   pg-json-binds            a bind whose static type is an array is
      #                            REINTERPRETED by node-postgres into a
      #                            Postgres array literal, which the column's
      #                            own JSON.parse reader then degrades to null
      #                            on every read -- how a `table_filter` scoped
      #                            to one table came to fire on all of them
      #                            (#10179). Type-directed because the bug is
      #                            invisible in the source: `${v.tableFilter}`
      #                            and `${v.name}` look identical.
      - name: Validate the source-tree locks
        shell: bash
        run: |
          source .github/scripts/run-step.sh
          run_step npm run validate:no-hand-written-mjs
          run_step npm run validate:single-schema-source
          run_step npm run validate:schema-opacity
          run_step npm run validate:schema-vocabularies
          run_step npm run validate:unreferenced-modules
          run_step npm run validate:unreferenced-exports
          run_step npm run validate:module-state-resets
          run_step npm run validate:pg-json-binds
          run_step npm run validate:retired-store-vocabulary
          report_steps

      - name: Validate Cloudflare config
        if: env.DOCS_ONLY != 'true'
        run: npm run cloudflare:verify:dry-run

      - name: Validate R2 manifest
        if: env.DOCS_ONLY != 'true'
        run: |
          npm run r2:manifest:dry-run
          npm run r2:download:dry-run
          npm run kv:publish:dry-run

      - name: Worker deploy dry-run
        if: env.DOCS_ONLY != 'true'
        run: npm run worker:deploy:dry-run

      - name: Worker bundle-size budget
        if: env.DOCS_ONLY != 'true'
        run: npm run worker:bundle:budget

      # Always runs, docs fast lane or not: a plain regex scan over
      # README/docs/registry/schemas/public/.github/workers/wrangler.jsonc for
      # secrets, private paths, and localhost URLs (scripts/scan-public-
      # safety.mjs) — no build, no network, and the exact gate a docs edit
      # could most plausibly trip (a pasted local path or token in a doc).
      - name: Public-safety scan
        run: npm run scan:public-safety

      # Always runs, docs fast lane or not: this scans all tracked files,
      # including Markdown, for private review internals and provider-private
      # routes. It is a security boundary, not a build/contract gate.
      - name: Validate private boundary
        run: npm run validate:private-boundary

  # The suite, split across runners (#10414). It shares nothing with `validate`
  # above -- that job's ~45 gates and this job's vitest passes were sequential
  # in one job purely because they were written that way, so a 486s test step
  # waited on 266s of validators for no reason.
  #
  # The MATRIX is over what run-ci-tests.ts already partitions: the mocking
  # pass keeps its own registry (#8922) and cannot merge into the shared one,
  # and the shared pass is sliced by file. Codecov merges every leg's upload by
  # commit SHA exactly as it already merged the two passes' separate reports,
  # so the denominator is unchanged -- see `Verify coverage reports exist`,
  # which still refuses an empty report rather than uploading a partial one.
  test:
    name: test (${{ matrix.name }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    strategy:
      # One red leg must not cancel the others: a shard-specific failure is
      # exactly the thing you want the other shards' results for.
      fail-fast: false
      matrix:
        include:
          - name: shared 1/3
            id: shared-1
            args: --pass=shared --shard=1/3
            cov: coverage
            junit: ""
          - name: shared 2/3
            id: shared-2
            args: --pass=shared --shard=2/3
            cov: coverage
            junit: ""
          - name: shared 3/3
            id: shared-3
            args: --pass=shared --shard=3/3
            cov: coverage
            junit: ""
          - name: mocked 1/2
            id: mocked-1
            args: --pass=mocked --shard=1/2
            cov: coverage-mocked
            junit: "-mocked"
          - name: mocked 2/2
            id: mocked-2
            args: --pass=mocked --shard=2/2
            cov: coverage-mocked
            junit: "-mocked"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Pin to the contributor's actual pushed commit, not GitHub's default
          # refs/pull/:N/merge preview -- keeps CI deterministic for a given sha
          # (a PR can't start failing just because main moved) and matches what
          # Codecov's patch status is measuring. See the coverage upload steps
          # below for why this specifically also fixes commit attribution.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      # Compute the deletion-filtered list of files this PR submits, inline in the
      # trusted workflow (PR contents are untrusted). It feeds ONLY the
      # reproducible-artifact verifier below, which diff-scopes its check to the
      # files actually changed. There is no reduced lane to forge — every PR runs
      # the full validation regardless of this list.
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.2
          cache: npm
          # Without this, setup-node's cache key hashes EVERY package-lock.json
          # in the tree, so a lockfile anywhere else would invalidate this job's
          # cache even though `npm ci` here only ever reads the root one.
          # packages/client is an npm
          # workspace (#3066) with no lockfile of its own anymore — its version
          # bumps land in the root lockfile, which this path already covers.
          cache-dependency-path: package-lock.json

      - name: Install
        # Behind the lockfile-keyed node_modules cache: a hit skips npm ci and
        # every postinstall's network reach with it (#10871) -- see the
        # composite's header for why setup-node's tarball cache cannot do this.
        uses: ./.github/actions/install-deps

      # Report-only SCA for the ROOT workspace — workers/** (the Worker API, MCP
      # server, webhook dispatcher), src/**, and scripts/** — the repo's larger,
      # more security-sensitive dependency surface, which until now had strictly
      # less CI coverage than apps/ui (#5543). Same posture as the apps/ui CVE
      # scan in the `ui` job below and the gate #1772 established: surface
      # high/critical runtime advisories at PR time without failing the job
      # (Renovate is async/non-blocking, so a feature PR can still merge a
      # vulnerable transitive dep between Renovate runs). No `--workspace` flag,
      # so this audits the whole lockfile — a superset that necessarily covers
      # the root deps this gap is about; the minor overlap with the apps/ui-
      # scoped scan is harmless since both are report-only. Never `--force`.
      # Tighten to blocking once it stays clean.
      - name: Build artifacts
        env:
          METAGRAPH_PRESERVE_PROBE_HEALTH: "1"
        run: npm run build

      - name: Prepare test reports dir
        run: mkdir -p reports/junit

      # `test:ci` (scripts/run-ci-tests.ts) runs the whole suite in two vitest
      # passes: the ~17 files that use vi.mock/vi.doMock/vi.unmock/
      # vi.resetModules keep per-file isolation because they rewrite the module
      # registry itself, and every other file runs with `--isolate=false`,
      # sharing one registry per worker (#8922). Each pass writes its own lcov +
      # junit -- neither is a valid coverage denominator alone, so BOTH are
      # uploaded and Codecov merges them.
      #
      # #8937 removed the former serial third pass: the filesystem-mutating
      # tests now build into their own copy of the repo's data directories
      # rather than the one shared artifact tree, so they parallelize with
      # everything else.
      #
      # NOTE: the `test` job intentionally does NOT participate in the docs
      # fast lane above. Coverage is a repo-wide delta gate (codecov.yml), not
      # diff-scoped, so shortcutting it on a docs-only PR would let a docs PR
      # merge without an accurate coverage report. It's also not the wall-clock
      # long pole when it does run alongside a fast `checks` job.
      - name: Test (split passes, with coverage gate)
        env:
          VITEST_JUNIT_PATH: reports/junit/vitest.xml
        run: node scripts/run-ci-tests.ts ${{ matrix.args }}

      # Both passes must have produced a report -- an empty/missing one would
      # otherwise upload a partial denominator and silently understate coverage.
      - name: Verify coverage reports exist
        run: |
          test -s ${{ matrix.cov }}/lcov.info

      # Coverage and results leave as ARTIFACTS; the `coverage` job below does
      # the single Codecov upload (#10414).
      #
      # WHY NOT UPLOAD FROM EACH LEG: the Codecov CLI is downloaded and
      # GPG-verified once per upload, and that verification races its own key
      # propagation across edge nodes -- observed here as
      # "gpg: Can't check signature: No public key" on the mocked leg, with the
      # tests themselves green. Uploading per leg multiplies a known transient
      # by the shard count. One upload also means Codecov computes the verdict
      # ONCE over the whole merged set, so `after_n_builds` stops being coupled
      # to how many shards happen to exist.
      #
      # Staged into a flat directory with per-leg names because the three shared
      # shards all write `coverage/lcov.info` and `reports/junit/vitest.xml` --
      # identical paths on different runners, which merge-multiple would
      # collapse into whichever landed last.
      - name: Stage coverage + results for the merge job
        run: |
          mkdir -p cov-out
          cp ${{ matrix.cov }}/lcov.info cov-out/lcov-${{ matrix.id }}.info
          cp reports/junit/vitest${{ matrix.junit }}.xml cov-out/vitest-${{ matrix.id }}.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.id }}
          path: cov-out/
          retention-days: 1
          if-no-files-found: error

  # ONE Codecov upload, over every leg's report (#10414).
  #
  # `needs: test` waits for all four legs, so the verdict is computed once over
  # the complete set rather than whenever Codecov decides it has seen enough
  # uploads. That is what makes codecov.yml's `after_n_builds: 1` correct and
  # keeps it correct when the shard count changes.
  #
  # `!cancelled()` rather than `success()`: a red leg still produced a coverage
  # report for the legs that passed, and uploading it is how the PR comment
  # shows what the failure did to coverage. A leg that never ran uploads
  # nothing, which `if-no-files-found: error` above turns into a loud failure
  # rather than a silently partial merge.
  coverage:
    name: coverage
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Download every leg's coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true
          path: cov

      # Every leg must have produced a report. A missing one would upload a
      # partial denominator and understate coverage silently, which is the
      # failure this check has always existed to prevent.
      - name: Verify every leg's report arrived
        run: |
          for f in lcov-shared-1 lcov-shared-2 lcov-shared-3 lcov-mocked-1 lcov-mocked-2; do
            test -s "cov/$f.info" || { echo "missing or empty: cov/$f.info"; exit 1; }
          done

      # Upload coverage to Codecov — the primary PR coverage gate (delta-based
      # project + patch, see codecov.yml). vitest's thresholds are now just a
      # local backstop. Missing coverage or upload errors fail the test job.
      #
      # WHICH PATH A RUN TAKES is decided by whether it can read secrets, NOT by
      # whether the branch lives in this repo — those are different questions and
      # conflating them is what broke every Dependabot PR (#9300):
      #
      #   main pushes + ordinary same-repo PRs -> token path
      #   fork PRs                             -> tokenless
      #   DEPENDABOT PRs                       -> tokenless
      #
      # A Dependabot PR is same-repo, so it used to take the token path — but
      # `pull_request` runs triggered by Dependabot get their own secret scope
      # and cannot read `secrets.CODECOV_TOKEN`. It resolved to the empty string,
      # and Codecov rejected the protected branch outright:
      #
      #   -> Token length: 0
      #   error -- Commit creating failed: {"message":"Token required because
      #            branch is protected"}
      #
      # With fail_ci_if_error: true that fails the whole test job, so no
      # dependency bump could ever go green. Routing it down the same tokenless
      # path forks already use is the honest fix: from this workflow's point of
      # view Dependabot IS a no-secrets trigger. The alternative — granting the
      # token in the repo's Dependabot secret scope — leaves the workflow broken
      # by default for anyone who clones it, and silently re-breaks if that
      # setting is ever lost.
      #
      # Explicit override_branch/commit/pr on BOTH paths below: GITHUB_SHA is the
      # ephemeral refs/pull/:N/merge commit on pull_request events, and the
      # checkout step above pins to the real head sha instead (so tests run the
      # contributor's actual commit) -- so auto-detection would otherwise attach
      # the report to a merge sha that never appears in the PR's own checks list.
      #
      # version: pinned, not the action's own 'latest' default (metagraphed#7554's
      # own CI hit "Could not verify signature" on the CLI's self-download+GPG-verify
      # step -- root-caused by reading codecov-action's dist/codecov.sh: it builds
      # the download URL as cli.codecov.io/${CC_VERSION}/..., and with 'latest' that
      # resolves through Codecov's CDN alias, where the binary/SHA256SUM/.sig can
      # momentarily disagree across edge nodes -- confirmed transient: a re-run
      # ~1 min later succeeded with no other change. A pinned version tag is an
      # immutable, long-since-fully-propagated path, so this class of race can't
      # recur here. Bump deliberately (not blindly to whatever's newest) if pinning
      # ever needs to move.
      - name: Upload coverage to Codecov
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cov/lcov-shared-1.info,./cov/lcov-shared-2.info,./cov/lcov-shared-3.info,./cov/lcov-mocked-1.info,./cov/lcov-mocked-2.info
          disable_search: true
          version: v11.3.1
          override_branch: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          override_commit: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          override_pr: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
          fail_ci_if_error: true

      # override_branch is prefixed with the fork owner (owner:branch): Codecov only treats a branch
      # string with a colon-separated prefix as "unprotected"/tokenless-eligible; a bare branch name
      # looks like it could be a real (possibly protected) branch on the base repo and gets rejected with
      # "Token required because branch is protected" even with zero token configuration anywhere.
      # codecov-cli's own auto-detection never adds this prefix either (verified in its source), so it
      # must be supplied explicitly. override_commit/override_pr are unaffected -- that check only
      # inspects the branch string.
      - name: "Upload coverage to Codecov (tokenless: fork or Dependabot)"
        if: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./cov/lcov-shared-1.info,./cov/lcov-shared-2.info,./cov/lcov-shared-3.info,./cov/lcov-mocked-1.info,./cov/lcov-mocked-2.info
          disable_search: true
          version: v11.3.1
          override_branch: ${{ github.event.pull_request.head.repo.owner.login }}:${{ github.event.pull_request.head.ref }}
          override_commit: ${{ github.event.pull_request.head.sha }}
          override_pr: ${{ github.event.pull_request.number }}
          fail_ci_if_error: true

      - name: Upload Vitest results to Codecov
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cov/vitest-shared-1.xml,./cov/vitest-shared-2.xml,./cov/vitest-shared-3.xml,./cov/vitest-mocked-1.xml,./cov/vitest-mocked-2.xml
          report_type: test_results
          disable_search: true
          version: v11.3.1
          override_branch: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          override_commit: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          override_pr: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
          fail_ci_if_error: false

      - name: "Upload Vitest results to Codecov (tokenless: fork or Dependabot)"
        if: ${{ !cancelled() && github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./cov/vitest-shared-1.xml,./cov/vitest-shared-2.xml,./cov/vitest-shared-3.xml,./cov/vitest-mocked-1.xml,./cov/vitest-mocked-2.xml
          report_type: test_results
          disable_search: true
          version: v11.3.1
          override_branch: ${{ github.event.pull_request.head.repo.owner.login }}:${{ github.event.pull_request.head.ref }}
          override_commit: ${{ github.event.pull_request.head.sha }}
          override_pr: ${{ github.event.pull_request.number }}
          fail_ci_if_error: false

  # Every hermetic Python suite in the repo, both of which existed without a runner.
  #
  # The Python SDK (python/) ships its own suite (37 cases) but was never run in CI — a
  # regression in retry/backoff, Retry-After capping, pagination, JSON-RPC unwrap, or the
  # SSRF-safe redirect handler could land on a PR (and reach PyPI) despite covering tests
  # existing.
  #
  # scripts/test_*.py (44 cases) covers the surviving data-refresh scripts' pure helpers and
  # had no runner either: discovery here reads python/tests, and vitest does not see .py at
  # all. #9473 is what that costs — four of those files spent two weeks importing scripts
  # deleted in #7012, failing on contact, with nothing to go red.
  #
  # Independent of the Node job, so this adds no wall-clock to the `test` long pole.
  python:
    name: python
    needs: changes
    # Path-gated at the JOB level (safe: zero required status contexts on main, and the review
    # pipeline buckets skipped as success -- see the `test` job comment): both suites read only
    # python/** and scripts/**.py, so a PR touching neither cannot change this job's result. Draft
    # PRs skip entirely, same as every heavy job here. Push/dispatch runs are unaffected.
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft != true && needs.changes.outputs.run_python_validation == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15 # two hermetic unittest suites (37 + 44 cases), no network
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      # `--extra test` installs the httpx-backed test deps (declared in pyproject's
      # [test] extra) so the async cases run instead of skipping. uv provisions a
      # Python within `requires-python = ">=3.9"`. No new runtime dependency.
      - name: Test Python SDK
        working-directory: python
        run: uv run --extra test python -m unittest discover -s tests

      # Stdlib unittest with no third-party imports (each case loads its subject by path via
      # importlib and asserts pure helpers), so this runs OUTSIDE the SDK's project environment
      # -- `--no-project` keeps python/'s pyproject from being resolved for a suite that does not
      # belong to it. Discovery is the point: a test whose subject has been deleted fails at
      # import here instead of sitting unrun.
      - name: Test data-refresh scripts
        run: uv run --no-project python -m unittest discover -s scripts -p 'test_*.py'

  # apps/ui (TanStack Start/Vite frontend, #3062) — entirely independent of the backend job above:
  # a backend-only PR never installs or builds this tree, and vice versa. Gated on run_ui_validation
  # (see the `changes` job comment) at the JOB level since 2026-07-24 — the old per-step guard
  # pattern still consumed a full runner on every backend PR just to boot, check out, and evaluate
  # ~18 false guards. Job-level skip is safe for the same reason as `test`'s draft skip: this repo
  # has ZERO required status contexts on main, and the review pipeline's fetchLiveCiAggregate
  # buckets skipped identically to success. Draft PRs skip entirely, mirroring the other heavy jobs.
  ui:
    name: ui
    needs: changes
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft != true && needs.changes.outputs.run_ui_validation == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30 # workspace install, drift-check builds, typecheck/test, and the Playwright e2e pass
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json

      # Installs the whole workspace tree (root + apps/ui + packages/client)
      # from the one root lockfile -- there is no way to `npm ci` a single
      # workspace in isolation.
      - name: Install
        # Behind the lockfile-keyed node_modules cache: a hit skips npm ci and
        # every postinstall's network reach with it (#10871) -- see the
        # composite's header for why setup-node's tarball cache cannot do this.
        uses: ./.github/actions/install-deps

      # apps/ui consumes packages/client as a live workspace link (#3066), not
      # a published package. packages/client/dist/index.js + index.cjs (the
      # RUNTIME bundle only, NOT the .d.ts type declarations -- see
      # packages/client/.gitignore) ARE committed specifically so Cloudflare
      # Workers Builds' live deploy never has to build them: that build
      # depends on `tsup` resolving correctly via PATH inside a `cd`'d-into
      # workspace directory, which real Workers Builds runs hit failing in
      # ways this repo's own environment never reproduced (npm
      # hoisting/caching differences between environments) -- eliminating
      # the build-at-deploy-time step entirely removes that whole failure
      # class. Deliberately NOT a package.json "prepare" script either: that
      # would auto-run the build on every `npm install`/`ci` for anyone in
      # the repo, which a security scan flagged as unnecessary install-time
      # code execution (#3066 review). This step exists purely as a DRIFT
      # CHECK: rebuild fresh and diff against the committed copy (`git diff`
      # only considers tracked files, so the gitignored .d.ts is naturally
      # excluded here without any extra scoping), so an edit to
      # packages/client/src without a matching
      # `npm run build --workspace=packages/client` + commit of the runtime
      # bundle fails loudly here rather than shipping stale runtime code.
      - name: Build packages/client (drift check)
        run: |
          npm run build --workspace=packages/client
          if ! git diff --exit-code -- packages/client/dist; then
            echo "::error::packages/client/dist is stale -- run 'npm run build --workspace=packages/client' and commit the result."
            exit 1
          fi

      # Same drift-check shape as packages/client above, same reason:
      # packages/ui-kit/dist/{index.js,index.cjs,index.css} are committed
      # (see packages/ui-kit/.gitignore) so apps/ui's Cloudflare Workers
      # Builds deploy never depends on rebuilding a sibling workspace
      # package first (#4860).
      - name: Build packages/ui-kit (drift check)
        run: |
          npm run build --workspace=packages/ui-kit
          if ! git diff --exit-code -- packages/ui-kit/dist; then
            echo "::error::packages/ui-kit/dist is stale -- run 'npm run build --workspace=packages/ui-kit' and commit the result."
            exit 1
          fi

      # Same drift-check shape as packages/client/packages/ui-kit above, same
      # reason: packages/chain-summaries/dist/{index.js,index.cjs} are
      # committed (see packages/chain-summaries/.gitignore) so apps/ui's
      # Cloudflare Workers Builds deploy never depends on rebuilding a sibling
      # workspace package first (#8525).
      - name: Build packages/chain-summaries (drift check)
        run: |
          npm run build --workspace=packages/chain-summaries
          if ! git diff --exit-code -- packages/chain-summaries/dist; then
            echo "::error::packages/chain-summaries/dist is stale -- run 'npm run build --workspace=packages/chain-summaries' and commit the result."
            exit 1
          fi

      # Same drift-check shape as packages/client/packages/ui-kit above
      # (#1652's docs-freshness acceptance line): content/docs/api-reference/
      # is entirely generated from public/metagraph/openapi.json (except the
      # one hand-written index.mdx the generator itself preserves) -- a
      # contract-changing PR that forgets to re-run the generator ships
      # stale/missing docs pages silently otherwise (caught live 2026-07-18:
      # two newly-merged routes had zero corresponding doc pages).
      - name: Build API reference docs (drift check)
        working-directory: apps/ui
        run: |
          node scripts/generate-openapi-docs.ts
          if ! git diff --exit-code -- content/docs/api-reference; then
            echo "::error::apps/ui/content/docs/api-reference is stale -- run 'node scripts/generate-openapi-docs.ts' (from apps/ui) and commit the result."
            exit 1
          fi

      # Same drift-check shape as the API reference docs step just above
      # (#6634, the #1652 acceptance line that was never actually built):
      # content/docs/catalog.mdx is entirely generated from the curated
      # registry/subnets/ overlays via scripts/lib/readme-catalog.ts (the
      # same renderer README.md's own catalog section uses) -- an enriched
      # subnet that never regenerates this page silently drifts otherwise.
      - name: Build subnet catalog docs (drift check)
        working-directory: apps/ui
        run: |
          node scripts/generate-catalog-docs.ts
          if ! git diff --exit-code -- content/docs/catalog.mdx; then
            echo "::error::apps/ui/content/docs/catalog.mdx is stale -- run 'node scripts/generate-catalog-docs.ts' (from apps/ui) and commit the result."
            exit 1
          fi

      # Same drift-check shape again, and here it IS the acceptance criterion:
      # #8610 asks that "every enforced limit on the page matches tier config as
      # code". content/docs/limits.mdx is generated from the five live
      # *_TIERED_RATE_LIMIT objects, and tests/api-tiers.test.ts already binds
      # those to the Cloudflare bindings in wrangler.jsonc -- so this step
      # closes the chain page -> config -> binding. A ceiling raised without
      # regenerating would leave callers planning against a number we no longer
      # enforce.
      - name: Build limits docs (drift check)
        working-directory: apps/ui
        run: |
          node scripts/generate-limits-docs.ts
          if ! git diff --exit-code -- content/docs/limits.mdx; then
            echo "::error::apps/ui/content/docs/limits.mdx is stale -- run 'node scripts/generate-limits-docs.ts' (from apps/ui) and commit the result."
            exit 1
          fi

      # #8705: content/news/** is generated from registry/generated/digests.json.
      # The store is append-only, so a page written once regenerates
      # byte-identical forever -- which is what makes this check a real signal
      # rather than noise. A digest added to the store without regenerating
      # would leave the archive index disagreeing with the pages it links to.
      - name: Build digest pages (drift check)
        working-directory: apps/ui
        run: |
          node scripts/generate-digest-pages.ts
          if ! git diff --exit-code -- content/news; then
            echo "::error::apps/ui/content/news is stale -- run 'node scripts/generate-digest-pages.ts' (from apps/ui) and commit the result."
            exit 1
          fi

      - name: Typecheck packages/ui-kit
        run: npm run typecheck --workspace=packages/ui-kit

      - name: Test packages/ui-kit
        run: npm test --workspace=packages/ui-kit

      # Enforces the #4867 epic's core invariant: packages/ui-kit stays a
      # real, standalone library. no-restricted-imports (packages/ui-kit/
      # eslint.config.ts) fails on @tanstack/react-router,
      # @tanstack/react-query, or any import resolving into apps/ui/**.
      - name: Lint packages/ui-kit (app-logic import guardrail)
        run: npm run lint --workspace=packages/ui-kit

      - name: Typecheck packages/chain-summaries
        run: npm run typecheck --workspace=packages/chain-summaries

      - name: Test packages/chain-summaries
        run: npm test --workspace=packages/chain-summaries

      # Enforces #8525's core invariant: this package stays a real,
      # standalone, framework-free library both apps/ui and workers/ import
      # identically. no-restricted-imports (packages/chain-summaries/
      # eslint.config.ts) fails on react or any import resolving into
      # apps/ui/**.
      - name: Lint packages/chain-summaries (app-logic import guardrail)
        run: npm run lint --workspace=packages/chain-summaries

      # Same content-hashed indexes as the validate job's lint step (#10608).
      # apps/ui has its OWN eslint/prettier config, so the key hashes those
      # rather than the root's -- a rule change here must not be masked by a
      # cache keyed on a file this workspace does not read.
      - name: Cache lint + format indexes (apps/ui)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/ui/.eslintcache
            apps/ui/.prettiercache
          key: ${{ runner.os }}-ui-lintcache-${{ hashFiles('package-lock.json', 'apps/ui/eslint.config.ts', 'apps/ui/.prettierrc', 'apps/ui/.prettierignore') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ui-lintcache-${{ hashFiles('package-lock.json', 'apps/ui/eslint.config.ts', 'apps/ui/.prettierrc', 'apps/ui/.prettierignore') }}-

      - name: Lint (ESLint + Prettier)
        run: npm run lint --workspace=apps/ui && npm run format:check --workspace=apps/ui

      # Same incremental-typecheck cache as the test job (#8924); apps/ui is the
      # bigger win at 28.9s -> 5.6s warm.
      - name: Cache TypeScript buildinfo (apps/ui)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/ui/tsconfig.tsbuildinfo
          key: ${{ runner.os }}-tsbuildinfo-ui-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-tsbuildinfo-ui-${{ hashFiles('package-lock.json') }}-

      - name: Typecheck
        run: npm run typecheck --workspace=apps/ui

      - name: Test
        run: npm test --workspace=apps/ui

      # LOVABLE_SANDBOX force-enables Nitro's cloudflare-module preset outside
      # Lovable's own environment (the preset otherwise emits a static-only
      # client build with no Worker entry) -- matches the exact env Cloudflare
      # Workers Builds sets in production (see apps/ui/DEPLOY.md).
      - name: Build
        # build:worker owns LOVABLE_SANDBOX + NITRO_PRESET: they decide whether
        # Nitro emits a Worker entry at all, and WHERE (dist/, not .output/).
        # Named so the e2e server below and this step cannot drift apart.
        #
        # `:e2e` additionally pins VITE_METAGRAPH_API_BASE at the local stub
        # (apps/ui/tests/e2e/api-stub.ts). That value is baked in at build time,
        # and it is the only lever that reaches the app's SSR fetches -- which
        # `page.routeFromHAR` cannot intercept, because it sees the browser and
        # not the server. Without it the overflow sweep reads live production on
        # every run, and a production wobble fails a PR that touched nothing
        # (#10938: main went red three times on a backend-only commit).
        #
        # This build is for TESTING ONLY. The bundle deployed to production is
        # built by Cloudflare Workers Builds from the same `build:worker`
        # without this env, so pinning the API base here cannot reach a user.
        run: npm run build:worker:e2e --workspace=apps/ui

      # Cache the downloaded browser binary across runs (#8910): the install
      # step below measured 65s (11% of this job), and re-downloading the same
      # Chromium build on every PR is the bulk of it. Keyed on the resolved
      # @playwright/test version rather than the lockfile hash, since that is
      # the only input that changes which binary is downloaded -- an unrelated
      # dependency bump must not evict a still-correct browser.
      - name: Resolve Playwright version
        if: ${{ needs.changes.outputs.run_ui_e2e == 'true' }}
        id: playwright-version
        working-directory: apps/ui
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: ${{ needs.changes.outputs.run_ui_e2e == 'true' }}
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      # Uses the @playwright/test devDependency already installed by `npm ci`
      # above (not a fresh npx fetch) -- installs just its matching browser
      # binary, no separate version to keep in sync.
      #
      # The OS-level dependencies `--with-deps` installs live in system paths,
      # NOT in the cached ~/.cache/ms-playwright, so they must be (re)installed
      # on a cache hit too -- `install-deps` does exactly that without
      # re-downloading the browser. Skipping it entirely on a hit would leave
      # the cached binary unable to launch on a runner image whose preinstalled
      # libraries have since drifted.
      - name: Install Playwright Chromium
        if: ${{ needs.changes.outputs.run_ui_e2e == 'true' }}
        working-directory: apps/ui
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      # Baseline-diff, not zero-tolerance -- see responsive-overflow.spec.ts.
      # Fails only on a NEW element escaping the viewport that isn't already
      # in the known baseline, so this doesn't block on the existing tracked
      # overflow backlog (#3930, #3931, #3985, etc.).
      - name: Responsive overflow check (e2e)
        if: ${{ needs.changes.outputs.run_ui_e2e == 'true' }}
        run: npm run test:e2e --workspace=apps/ui

      # The e2e server is a LOCAL `wrangler dev` on this runner (playwright.config.ts's
      # webServer), not a deployed Worker -- so when it dies there is nothing in the
      # Cloudflare dashboard to read, and the only record is the log file wrangler
      # names on its way out.
      #
      # Without this the failure is undiagnosable. Observed three times across main
      # and a feature branch: wrangler prints a bare `✘ [ERROR]` with an EMPTY body,
      # the process exits ~20 page-loads in, and every subsequent navigation fails
      # ERR_EMPTY_RESPONSE -> ERR_CONNECTION_REFUSED. The reported test is just
      # whichever route was in flight, which is why it looks like a different
      # "overflow" failure each run. The actual reason goes to this file and dies
      # with the runner.
      #
      # `if: failure()` rather than `always()`: on a green run this is noise, and the
      # log is only interesting when the server did something unexpected.
      - name: Upload e2e server + report artifacts on failure
        if: ${{ failure() && needs.changes.outputs.run_ui_e2e == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-e2e-failure-logs
          path: |
            ~/.config/.wrangler/logs/*.log
            apps/ui/playwright-report/**
            apps/ui/test-results/**
          retention-days: 7
          if-no-files-found: warn

      # Guard against client-bundle regressions. Measures the INITIAL client
      # transfer for a cold visit to "/" -- the entry chunk plus the transitive
      # closure of its STATIC imports (the shared/vendor graph), deliberately
      # excluding lazily-loaded route chunks (dynamic import()), which the
      # browser never fetches on first paint. Source of truth is TanStack
      # Start's per-route preload manifest
      # (dist/server/_tanstack-start-manifest_v-*.mjs): each route's
      # `preloads` is its static module graph, so the cold first-load set is
      # __root__ (the entry) ∪ the "/" route's preloads. Raised deliberately
      # here (metagraphed#7760/#7759, 300 -> 320) for PostHog's client-side
      # analytics + error-tracking init wiring in src/lib/analytics.ts --
      # posthog-js itself stays OUT of this measurement (it's loaded via a
      # dynamic import(), confirmed via a real local build: it lands in its
      # own separate chunk, never in __root__/"/"'s static preloads), but the
      # thin always-loaded wrapper (init/capture/captureException, wired into
      # routes/__root.tsx) pushed the real baseline from ~303 KB to ~305 KB
      # gzipped. The Lovable-sync registry-ticker redesign (global AppShell
      # chrome on every page) landed around the same time and separately adds
      # a chain-head query and a market-data server function -- both already
      # covered by the same 320 KB budget. Raise it again the same way when a
      # real feature legitimately grows the initial load further.
      #
      # 320 -> 340 (metagraphed#8266): main had drifted to exactly 320 KB
      # against the 320 KB budget -- zero headroom -- so the gate had started
      # failing PRs that cannot affect client JS at all. #8263 is the proof: it
      # touches only src/lib/analytics-proxy.ts, imported solely by
      # src/server.ts (server-only, never in a client chunk), and still
      # reported 321 KB. With `Math.ceil` on a baseline sitting on the boundary,
      # ordinary build-to-build gzip variance alone flips 320 -> 321, so the
      # gate was blocking every UI PR on noise rather than on a regression.
      # 340 restores ~6% headroom -- enough to absorb that variance, small
      # enough to still catch a real regression. The 305 -> 320 drift that
      # consumed the previous headroom is unexplained and tracked separately in
      # metagraphed#8267; this bump deliberately does NOT close that out.
      #
      # 340 -> 360 (metagraphed#8468): the same trap, one budget tier later.
      # A clean main build (measured directly with this step's own script)
      # sits at 339.25 KB gzipped -- `Math.ceil` -> 340 KB against a 340 KB
      # budget, zero headroom again. Two unrelated PRs (#8465, #8466) failed
      # on this at the same time, each with a real measured delta under 100
      # bytes -- proof the gate was blocking on drift, not on either PR's own
      # regression. 360 restores ~6% headroom, matching the 320 -> 340 bump's
      # own margin. The underlying drift is still unexplained and still
      # tracked separately (#8267); this bump deliberately does not close
      # that out either.
      #
      # dist/, not Nitro's library-default .output/ -- this project's
      # vite.config.ts (@lovable.dev/vite-tanstack-config) is customized to
      # output there instead (confirmed against a real local + CI build; the
      # standalone repo's own now-removed ci.yml had this as `.output/...`,
      # which never actually matched this project's real build output).
      - name: Bundle size budget (initial client JS, gzipped)
        working-directory: apps/ui
        env:
          # Raised 360 -> 400 (#8745). Not because this PR needed it: main
          # measured 352 KB and /chain/emissions took it to 353, since the page
          # is a lazy route chunk and only its ~1 KB of shared query/type code
          # lands in the initial load. Raised because 8 KB of headroom is not a
          # budget, it is a tripwire on whichever PR happens to be next.
          BUDGET_KB: 400
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync } from "node:fs";
          import { gzipSync } from "node:zlib";
          import path from "node:path";

          const PUBLIC_DIR = "dist/client";
          const SERVER_DIR = "dist/server";

          const manifestFile = readdirSync(SERVER_DIR).find((f) =>
            /^_tanstack-start-manifest_v-.*\.mjs$/.test(f),
          );
          if (!manifestFile) {
            console.error(
              "::error::Could not find the TanStack Start manifest (_tanstack-start-manifest_v-*.mjs) in " +
                SERVER_DIR +
                " — the bundle-size gate cannot measure the initial load. Did the build setup change?",
            );
            process.exit(1);
          }

          const mod = await import(path.resolve(SERVER_DIR, manifestFile));
          const accessor = mod.default ?? Object.values(mod).find((v) => typeof v === "function");
          const manifest = typeof accessor === "function" ? accessor() : accessor;
          const routes = manifest?.routes;
          if (!routes?.__root__) {
            console.error("::error::Manifest has no routes/__root__ — cannot determine the entry chunk.");
            process.exit(1);
          }

          const rootPreloads = routes.__root__.preloads ?? [];
          const homePreloads = routes["/"]?.preloads ?? [];
          const initial = [...new Set([...rootPreloads, ...homePreloads])].filter((f) =>
            f.endsWith(".js"),
          );
          if (initial.length === 0) {
            console.error("::error::No initial JS preloads found in the manifest — refusing to report 0 KB.");
            process.exit(1);
          }

          const buffers = initial
            .sort()
            .map((f) => readFileSync(path.join(PUBLIC_DIR, f.replace(/^\//, ""))));
          const bytes = gzipSync(Buffer.concat(buffers)).length;
          const kb = Math.ceil(bytes / 1024);

          const BUDGET_KB = Number(process.env.BUDGET_KB ?? 300);
          console.log(
            `Initial client JS (entry + static-import closure, gzipped): ${kb} KB / budget ${BUDGET_KB} KB  [${initial.length} chunks, lazy route chunks excluded]`,
          );
          if (kb > BUDGET_KB) {
            console.error(
              `::error::Initial client JS ${kb} KB exceeds the ${BUDGET_KB} KB budget — investigate the regression or raise the budget deliberately.`,
            );
            process.exit(1);
          }
          NODE

      # Report-only SCA (same posture as the CVE scan the standalone repo's own
      # CI ran) -- surfaces high/critical runtime-dependency advisories at PR
      # time without failing the job. Tighten to blocking once it stays clean.
      - name: Dependency CVE scan (SCA, report-only)
        run: |
          npm audit --audit-level=high --omit=dev --workspace=apps/ui \
            || echo "::warning::npm audit found high/critical advisories in apps/ui's runtime dependencies — review above (report-only; not failing CI yet)"
