name: Validate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Retain exact native source formatting diff
        run: |
          npx --no-install prettier --write workers/edge-cache.ts tests/analytics-cache-policy.test.ts tests/request-handlers-analytics.test.ts
          git diff -- workers/edge-cache.ts tests/analytics-cache-policy.test.ts tests/request-handlers-analytics.test.ts
      - name: Lint the focused source and regressions
        run: npx --no-install eslint workers/edge-cache.ts tests/analytics-cache-policy.test.ts tests/request-handlers-analytics.test.ts
      - name: Cold source typecheck
        run: npm run typecheck
