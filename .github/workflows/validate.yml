name: Chain-stream readiness qualification

on:
  push:
    branches:
      - ci/chain-stream-readiness-qualification-20261018

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup existing Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install existing workspace dependencies
        uses: ./.github/actions/install-deps
      - name: Build existing workspace packages
        run: |
          npm run build --workspace=packages/client
          npm run build --workspace=packages/ui-kit
          npm run build --workspace=packages/chain-summaries
          git diff --exit-code -- packages/client/dist packages/ui-kit/dist packages/chain-summaries/dist
      - name: Build existing fixture-backed UI worker
        run: npm run build:worker:e2e --workspace=apps/ui
      - name: Resolve existing Playwright version
        id: playwright-version
        working-directory: apps/ui
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache matching Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: Install matching Playwright Chromium
        working-directory: apps/ui
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Compare original and candidate ten times with retries disabled
        run: node scripts/qualify-chain-stream-readiness.mjs
      - name: Retain exact diagnostic reports and server logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chain-stream-readiness-qualification
          path: |
            /tmp/chain-stream-readiness
            ~/.config/.wrangler/logs
          if-no-files-found: error
          retention-days: 7
