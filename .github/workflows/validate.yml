name: Validate

on:
  push:
    branches: [ci/dependency-audit-evidence-20261018]

permissions:
  contents: read

jobs:
  dependency-audit-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
          cache-dependency-path: package-lock.json
      - name: Inspect current upstream dependency compatibility
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from "node:child_process";
          import { mkdirSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const output = join(process.env.RUNNER_TEMP, "dependency-audit");
          mkdirSync(output, { recursive: true });
          const packages = ["@graphql-codegen/cli", "@graphql-codegen/typescript-resolvers", "@graphql-tools/utils", "@graphql-tools/url-loader", "@graphql-tools/executor-legacy-ws", "@fastify/busboy", "smol-toml", "braces", "sharp"];
          const reports = {};
          for (const name of packages) {
            const result = spawnSync("npm", ["view", name, "version", "dependencies", "engines", "--json"], { encoding: "utf8", maxBuffer: 2 * 1024 * 1024 });
            if (result.error || result.status !== 0) throw new Error("Registry inspection failed: " + name);
            const report = JSON.parse(result.stdout); reports[name] = report;
            console.log("REGISTRY_" + name + " " + JSON.stringify(report));
          }
          writeFileSync(join(output, "registry.json"), JSON.stringify(reports, null, 2) + "\n");
          NODE
      - name: Upload dependency diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-audit-diagnostic
          path: ${{ runner.temp }}/dependency-audit/
          retention-days: 7
          if-no-files-found: error
