name: Sync delivery source formatting
on:
  push:
    branches: [codex/stable-sync-delivery-20261015]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: ./.github/actions/install-deps
      - name: Prepare pinned formatter source patch
        run: |
          npx --no-install prettier --write src/sync-delivery-receipt.ts src/sync-delivery-postgres.ts src/ledger-d1.ts src/ledger-neon-write.ts src/neuron-documents.ts src/neurons-neon-write.ts src/nominator-positions-neon-write.ts src/pass-completeness.ts src/sync-batch-queue.ts workers/data-api.ts workers/env-extra.d.ts tests/sync-delivery-receipt.test.ts tests/sync-delivery-routes.test.ts tests/sync-delivery-concurrency.test.ts
          git diff --binary > native-format.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sync-delivery-native-format
          path: native-format.patch
