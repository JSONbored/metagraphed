name: Quarantine source formatting

on:
  push:
    branches: [fix/sync-dead-letter-durable-quarantine-20261016]
    paths: [.github/workflows/quarantine-format.yml]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: >-
          node_modules/.bin/prettier --write
          docs/d1-state-migration.md
          src/dead-letter.ts
          src/sync-dead-letter-export.ts
          src/sync-dead-letter-store.ts
          tests/data-api-sync-queue-consumer.test.ts
          tests/data-api-sync-quarantine-isolate.test.ts
          tests/dead-letter.test.ts
          tests/helpers/sync-dead-letter-kv.ts
          tests/sync-dead-letter-export.test.ts
          tests/sync-dead-letter-store.test.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quarantine-formatted-source
          path: |
            docs/d1-state-migration.md
            src/dead-letter.ts
            src/sync-dead-letter-export.ts
            src/sync-dead-letter-store.ts
            tests/data-api-sync-queue-consumer.test.ts
            tests/data-api-sync-quarantine-isolate.test.ts
            tests/dead-letter.test.ts
            tests/helpers/sync-dead-letter-kv.ts
            tests/sync-dead-letter-export.test.ts
            tests/sync-dead-letter-store.test.ts
          if-no-files-found: error
          retention-days: 1
